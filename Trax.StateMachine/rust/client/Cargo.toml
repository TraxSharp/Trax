[package]
name = "trax-state-machine-client"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
description = "Drive a Trax state machine a host serves: persisted ids from the client manifest, the change stream over graphql-transport-ws, each event predicted with the Rust core."
license = "MIT"
repository = "https://github.com/TraxSharp/Trax"
publish = false

[lib]
name = "trax_state_machine_client"

[[bin]]
name = "trax-state-machine-client-testee"
path = "src/bin/client_testee.rs"

[dependencies]
trax-state-machine = { path = ".." }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ring = { version = "0.17", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# The public-surface tests read the crates' source (../tests/support/surface.rs); nothing ships with them.
[dev-dependencies]
prettyplease = "0.2"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
