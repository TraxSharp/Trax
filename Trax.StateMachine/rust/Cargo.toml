[package]
name = "trax-state-machine"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
description = "The Trax state-machine engine: machines built from the IR the C# engine exports, over canonical snapshots."
license = "MIT"
repository = "https://github.com/TraxSharp/Trax"
publish = false

[workspace]
members = ["client"]
resolver = "3"

[lib]
name = "trax_state_machine"

[[bin]]
name = "trax-state-machine-testee"
path = "src/bin/testee.rs"

[dependencies]

# The public-surface tests read the crates' source (tests/support/surface.rs); nothing ships with them.
[dev-dependencies]
prettyplease = "0.2"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }

# The engine catches a panicking custom handler and refuses with INTERNAL_ERROR, which needs unwinding.
[profile.release]
panic = "unwind"
