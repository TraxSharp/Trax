name: Pull Request

on:
  pull_request:
    branches: [main]

# Default to no permissions; the job widens only what it needs.
permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Guard against local-dev lockfile versions
        run: |
          if grep -rln '"resolved": "1.99.99"' --include=packages.lock.json . ; then
            echo "::error::A packages.lock.json contains the local-dev version 1.99.99. Regenerate lockfiles in CI mode (remove trax-local.props) before committing."
            exit 1
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Every project is locked
        run: .github/scripts/check-project-locks.sh Trax.Core.slnx
      - name: No deprecated packages
        run: .github/scripts/check-deprecated-packages.sh Trax.Core.slnx
      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror
      - name: Pack (package validation)
        # Package validation runs on pack, not build. Packing here compares Trax.Core and
        # Trax.Core.Testing with the baseline release before a merge, instead of at release time,
        # after semantic-release has already tagged the version.
        run: dotnet pack --configuration Release --no-build --output "$RUNNER_TEMP/nupkg"
      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Upload coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 1

  # The Codecov token is kept out of the job that runs restore, build and tests, so
  # nothing those leave running can read it. This job runs no project code.
  coverage:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        # Codecov maps the report's file paths onto the repository's tracked files.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          directory: ${{ runner.temp }}/coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ADRs for this repo live in docs/adr/ and are checked against this checkout alone. The
  # guard is published by Trax.Docs; nothing else needs to be cloned.
  #
  # Pinned at ed9d7a6e0325 (2026-09-28) on Trax.Docs main, which is where the guard now lives.
  # Bump this only to adopt a guard change, and read what changed first: a newer guard can fail
  # this repo on an ADR that was green before.
  adr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check ADRs
        uses: TraxSharp/Trax.Docs/.github/actions/adr-guard@ed9d7a6e0325cf5ed49a13e658dbc9319f1c4477
        with:
          known-areas: platform,testing,packaging
          census-root: tests/Trax.Core.Tests.Meta
