version: 2
updates:
  - package-ecosystem: "nuget"
    # Directory.Packages.props at the root pins every third-party package for every folder;
    # the lockfiles sit beside each project.
    directory: "/"
    schedule: { interval: "weekly" }
    # A release gets a week on nuget.org/npm before a bot proposes it, so a
    # hijacked version is usually caught and pulled first. Security updates are
    # not delayed by this.
    cooldown: { default-days: 7 }
    # One config now covers what ten repositories each limited to three. A bump that needs
    # a human costs a review either way, and a deep pile only outlasts the week's attention.
    open-pull-requests-limit: 5
    groups:
      # Group only minor + patch; major bumps get their own reviewable PRs.
      nuget-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["Microsoft.CodeAnalysis.*", "Microsoft.AspNetCore.Authentication.JwtBearer", "Microsoft.IdentityModel.*"]
        update-types: ["minor", "patch"]
      # Roslyn on its own. It is the package whose grouped bump makes Dependabot
      # inject <PackageReference ... VersionOverride="..."> into project files
      # that never referenced it, because the transitive graph resolves it at
      # different versions in different projects. The lockfile workflow reverts
      # that, but if the underlying conflict is real the PR still needs a human
      # -- and grouped in, it takes the rest of the week's bumps down with it.
      roslyn:
        patterns: ["Microsoft.CodeAnalysis.*"]
        update-types: ["minor", "patch"]
      # The JWT stack on its own, and deliberately not ignored: it is auth code,
      # so its security patches have to keep arriving. Grouped in with everything
      # else it is the bump that sweeps the whole Microsoft.Extensions 10.0.x
      # line, drags Microsoft.IdentityModel.* across several minors, changes
      # ConfigurationManager JWKS-refresh throttling and fails Trax.Api's Cognito
      # key-rotation tests with a 401. On its own that failure is legible and
      # costs nothing else.
      identity:
        patterns:
          - "Microsoft.AspNetCore.Authentication.JwtBearer"
          - "Microsoft.IdentityModel.*"
        update-types: ["minor", "patch"]
      # Security fixes in one PR instead of one per package. They are not delayed by the
      # cooldown and not affected by the ignores below.
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Trax packages are projects in this repository. The only Trax PackageReferences are
      # in Trax.Samples/templates/content, which carry no version: the template pack stamps
      # the version being released.
      - dependency-name: "Trax.*"
      # A HotChocolate major is a breaking migration to take deliberately,
      # not a bot PR.
      - dependency-name: "HotChocolate*"
        update-types: ["version-update:semver-major"]
      # The tools whose bump invalidates something committed beside them. Each has
      # to move in one commit with the artefact it regenerates, which a bot PR
      # cannot do -- it bumps the tool and leaves the check failing, every time.
      # Bump these by hand.
      #
      # csharpier lives in each folder's .config/dotnet-tools.json, and a minor bump
      # changes how it formats: bump it and run `dotnet csharpier format .` in one commit.
      - dependency-name: "csharpier"
      # PublicApiGenerator changes how it renders members, which rewrites the
      # committed PublicApi baselines: bump it and regenerate them together.
      - dependency-name: "PublicApiGenerator"
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only; the local composite actions pin their own steps.
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: "npm"
    directories:
      # The release tooling.
      - "/"
      - "/Trax.Api.StateMachine"
      - "/Trax.Core/plugins/vscode/trax-hints"
      # Each sample's frontend, and the scripts that record and photograph the samples for
      # traxsharp.net.
      - "/Trax.Samples/samples/ChatService/Trax.Samples.ChatService.Client"
      - "/Trax.Samples/samples/Recovery/Trax.Samples.Recovery.Client"
      - "/Trax.Samples/samples/StateMachine/web"
      - "/Trax.Samples/scripts/recordings"
      - "/Trax.Samples/scripts/screenshots"
      - "/Trax.Website"
      - "/Trax.Website/dashboard"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates for every directory above, in one PR.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Security fixes for every directory above, in one PR rather than one per directory.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # A major (TypeScript, vitest, jsdom, @types/node, ...) is a migration across up to ten
      # projects, taken deliberately, never one bot PR per project. Security fixes still arrive:
      # ignore rules do not apply to security updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The images the devcontainer and the compose files run, pinned by digest, so without
  # these nothing ever moves them.
  - package-ecosystem: "docker"
    directory: "/Trax.Effect/.devcontainer"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      docker: { patterns: ["*"] }
  - package-ecosystem: "docker-compose"
    directories: ["/Trax.Effect", "/Trax.Effect/.devcontainer", "/Trax.Scheduler", "/Trax.Samples"]
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      docker-compose: { patterns: ["*"] }
