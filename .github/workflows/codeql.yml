# Static analysis of the C#, TypeScript and Rust sources and of the workflows. build-mode: none
# reads the sources without compiling them, so for C#, TypeScript and the workflows this runs no
# restore, no MSBuild targets, no npm install and no package code. Rust is the exception: its
# extractor uses rust-analyzer, which fetches the crates Cargo.lock pins and runs their build
# scripts and proc macros, the same code the state-machine-rust CI job builds. That is why the
# analyze job may reach the Rust toolchain and crates.io.
#
# So analyze holds no write permission: it writes its results to an artifact and nothing else.
# upload, which builds and runs nothing, is the only job that may write to code scanning, and it
# uploads each language's results under that language's category only. A dependency's build script
# can still change the results of the run it is part of; it cannot reach the token that writes
# them, dismiss an alert, or write results for another language or ref.
#
# A pull request scans only the languages whose files it changes: a scan of untouched code
# cannot find anything the pull request introduced. A push to main and the weekly run scan
# every language, so the whole codebase stays covered and new queries reach old code.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Pick the languages to scan
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'languages=["csharp","javascript-typescript","rust","actions"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          languages=()
          grep -qE '\.(cs|csproj|props|targets|razor|cshtml)$' <<<"$changed" && languages+=(csharp)
          grep -qE '\.(ts|tsx|js|jsx|mjs|cjs|html)$' <<<"$changed" && languages+=(javascript-typescript)
          grep -qE '(\.rs|(^|/)Cargo\.(toml|lock)|(^|/)rust-toolchain\.toml)$' <<<"$changed" && languages+=(rust)
          grep -qE '^\.github/' <<<"$changed" && languages+=(actions)
          echo "Scanning: ${languages[*]:-nothing}"
          echo "languages=$(printf '%s\n' "${languages[@]}" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  analyze:
    needs: languages
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # no security-events: the results go to upload as an artifact
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            aka.ms:443
            builds.dotnet.microsoft.com:443
            ci.dot.net:443
            dot.net:443
            api.nuget.org:443
            globalcdn.nuget.org:443
            www.nuget.org:443
            azuresearch-usnc.nuget.org:443
            resharper-platform.jetbrains.com:443
            crl3.digicert.com:80
            crl4.digicert.com:80
            crl.globalsign.com:80
            crl.sectigo.com:80
            s.symcb.com:80
            ts-crl.ws.symantec.com:80
            www.microsoft.com:80
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif
      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: sarif/
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [languages, analyze]
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
      - name: Checkout
        # upload-sarif reads the commit it reports on; nothing here is built or run.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/sarif
      - name: Only this language's results
        env:
          DIR: ${{ runner.temp }}/sarif
          LANGUAGE: ${{ matrix.language }}
        run: |
          # analyze writes one SARIF file per language. Anything else in the artifact was not
          # written by CodeQL, so nothing is uploaded.
          mapfile -t files < <(find "$DIR" -type f)
          if [ "${#files[@]}" -ne 1 ] || [[ "${files[0]}" != *.sarif ]]; then
            echo "::error::Expected one SARIF file for $LANGUAGE, found: ${files[*]:-none}"
            exit 1
          fi
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/sarif
          category: /language:${{ matrix.language }}
