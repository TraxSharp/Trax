name: CI

# One workflow for every folder. The changes job decides which folders a pull request can
# affect (.github/scripts/ci-changes.sh, configured by .github/ci/packages.json) and the
# jobs below run only those. "CI result" is the one check branch protection requires: it
# always runs, so a folder skipped by the change detection never leaves a required check
# waiting.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this before it cuts a version. Any event but a pull request runs every
  # folder, so a release always tests the whole repository.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

# Default to no permissions; each job widens only what it needs.
permissions: {}

concurrency:
  # A release's run must not cancel, or be cancelled by, a pull request's.
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      folders: ${{ steps.changes.outputs.folders }}
      dotnet: ${{ steps.changes.outputs.dotnet }}
      adr: ${{ steps.changes.outputs.adr }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Decide what runs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/ci-changes.sh "$EVENT_NAME"

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet != '[]'
    name: ${{ matrix.package.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.package.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.dotnet) }}
    # A service whose image is empty is not started, so a folder that needs no database or
    # broker does not wait for one.
    services:
      postgres:
        image: ${{ matrix.package.postgres != '' && 'postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527' || '' }}
        env:
          POSTGRES_USER: trax
          POSTGRES_PASSWORD: trax123
          POSTGRES_DB: ${{ matrix.package.postgres }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trax"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      rabbitmq:
        # Default 'guest' user is restricted to localhost in RabbitMQ.
        # GitHub Actions service containers route through port forwarding,
        # so the broker sees connections as non-localhost and rejects
        # 'guest'. Override with a dedicated test user.
        image: ${{ matrix.package.rabbitmq && 'rabbitmq:4-management@sha256:dbaf95088210b885b305e338e846d8d2ce7a2659d4b4005da8da02b885a71671' || '' }}
        env:
          RABBITMQ_DEFAULT_USER: trax
          RABBITMQ_DEFAULT_PASS: trax123
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FOLDER: ${{ matrix.package.folder }}
      SOLUTION: ${{ matrix.package.solution }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore tools
        working-directory: ${{ matrix.package.folder }}
        run: dotnet tool restore
      - name: Check formatting
        working-directory: ${{ matrix.package.folder }}
        run: dotnet csharpier check .
      - name: Restore (locked)
        working-directory: ${{ matrix.package.folder }}
        run: dotnet restore "$SOLUTION" --locked-mode
      - name: Every project is locked
        run: .github/scripts/check-project-locks.sh "$FOLDER" "$SOLUTION"
      - name: No deprecated packages
        working-directory: ${{ matrix.package.folder }}
        run: ../.github/scripts/check-deprecated-packages.sh
      - name: Build
        working-directory: ${{ matrix.package.folder }}
        run: dotnet build "$SOLUTION" --configuration Release --no-restore -warnaserror
      - name: Pack (package validation)
        # Package validation runs on pack, not build. Packing here compares every package with
        # its baseline release before a merge, instead of at release time, after
        # semantic-release has already tagged the version.
        if: matrix.package.pack
        working-directory: ${{ matrix.package.folder }}
        run: dotnet pack "$SOLUTION" --configuration Release --no-build --output "$RUNNER_TEMP/nupkg"
      - name: Setup Node
        # Tests that drive Trax.Api.StateMachine's generators run them under node.
        if: matrix.package['state-machine']
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install Trax.Api.StateMachine (locked, no install scripts)
        if: matrix.package['state-machine']
        working-directory: Trax.Api.StateMachine
        run: npm ci --ignore-scripts
      - name: Raise the Postgres connection limit
        # dotnet test runs a solution's test projects in parallel, all against this one service,
        # and Postgres allows 100 connections by default. The Samples suites alone declare pools
        # summing to about 94 (Recovery 20+10, Scheduling 20, Auth 10, StateMachine 10, ...),
        # before the unpooled LISTEN session each host holds, the child processes the restart
        # tests start, and the admin and migration connections: past 100 a suite fails with
        # "too many clients already" depending only on which projects happened to overlap.
        # A service container takes no command line, so the setting cannot be passed as
        # `-c max_connections=`. ALTER SYSTEM writes it to postgresql.auto.conf in the
        # container's data directory, which a restart of the same container keeps (the
        # entrypoint skips initdb on an initialised directory), and max_connections is read
        # only at server start, hence the restart. The service's container id is the job
        # context's job.services.postgres.id.
        if: matrix.package.postgres != ''
        env:
          PGPASSWORD: trax123
          POSTGRES_DB: ${{ matrix.package.postgres }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql -h localhost -U trax -d "$POSTGRES_DB" -c "ALTER SYSTEM SET max_connections = 500;"
          docker restart "$POSTGRES_CONTAINER"
          for _ in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -h localhost -U trax > /dev/null; then
              break
            fi
            sleep 1
          done
          limit=$(psql -h localhost -U trax -d "$POSTGRES_DB" -tAc "SHOW max_connections;")
          echo "max_connections = $limit"
          if [ "$limit" != 500 ]; then
            echo "::error::Postgres did not take the raised connection limit."
            exit 1
          fi
      - name: Create test databases
        if: matrix.package.databases[0] != null
        env:
          PGPASSWORD: trax123
          POSTGRES_DB: ${{ matrix.package.postgres }}
          DATABASES: ${{ join(matrix.package.databases, ' ') }}
        run: |
          for db in $DATABASES; do
            psql -h localhost -U trax -d "$POSTGRES_DB" -c "CREATE DATABASE \"$db\";"
          done
      - name: Test
        working-directory: ${{ matrix.package.folder }}
        env:
          COVERAGE: ${{ matrix.package.coverage }}
          TEST_ARGS: ${{ matrix.package['test-args'] }}
        run: |
          args=(--configuration Release --no-build)
          # Word splitting is the point: TEST_ARGS is a list of flags from packages.json.
          # shellcheck disable=SC2206
          args+=($TEST_ARGS)
          if [ "$COVERAGE" = true ]; then
            include=$(cd .. && .github/scripts/coverage-include.sh "$FOLDER")
            args+=(--collect:"XPlat Code Coverage" --results-directory ./TestResults
              -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=$include")
          fi
          dotnet test "$SOLUTION" "${args[@]}"
      - name: Upload coverage results
        if: matrix.package.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.package.folder }}
          path: ${{ matrix.package.folder }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 1

  # The Codecov token is kept out of the jobs that run restore, build and tests, so
  # nothing those leave running can read it. This job runs no project code.
  coverage:
    needs: [changes, dotnet]
    if: needs.changes.outputs.dotnet != '[]'
    name: coverage ${{ matrix.package.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.dotnet) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        # Codecov maps the report's file paths onto the repository's tracked files.
        if: matrix.package.coverage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage results
        if: matrix.package.coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-${{ matrix.package.folder }}
          path: ${{ runner.temp }}/coverage
      - name: Upload coverage to Codecov
        if: matrix.package.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          directory: ${{ runner.temp }}/coverage
          flags: ${{ matrix.package.folder }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Each folder's ADRs are checked against that folder alone, by the guard built from
  # Trax.Docs/tools/Trax.Adr.Guard in this same checkout.
  adr-guard:
    needs: changes
    if: needs.changes.outputs.adr != '[]'
    name: adr-guard ${{ matrix.package.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.adr) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check ADRs
        # The local path is the point: this runs the action as the pull request changes it.
        uses: ./.github/actions/adr-guard  # zizmor: ignore[self-repository]
        with:
          folder: ${{ matrix.package.folder }}
          adr-root: ${{ matrix.package['adr-root'] }}
          known-areas: ${{ matrix.package['known-areas'] }}
          known-repos: ${{ matrix.package['known-repos'] || '' }}
          require-repos-key: ${{ matrix.package['require-repos-key'] || 'false' }}
          census-root: ${{ matrix.package['census-root'] }}

  website:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'Trax.Website')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Trax.Website
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install (locked, no install scripts)
        # Nothing the site builds with needs an install script: sharp and the Next.js
        # compiler ship prebuilt binaries as optional packages. If one ever does, run
        # `npm rebuild <package>` for it here rather than dropping --ignore-scripts.
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        # scripts/sync-docs.sh reads the docs from ../Trax.Docs in this checkout.
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # The operations dashboard (Trax.Website/dashboard/) is its own npm project with its own
  # lockfile. The site's build above builds its demo; this job runs its lint, its tests (every
  # story, and the demo's strict check that every page is answered by a recording) and both its
  # production builds.
  website-dashboard:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'Trax.Website')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Trax.Website/dashboard
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install (locked, no install scripts)
        # esbuild and rolldown ship their binaries as platform optional packages, so nothing
        # here needs an install script.
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        # Also checks the bundle carries none of the mock or the demo.
        run: npm run build
      - name: Build the demo
        # Also checks the demo carries its recordings and not the auto-mock schema.
        run: npm run build:demo
      - name: Build Storybook
        run: npm run build-storybook
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # The Recovery sample's page (Trax.Samples/samples/Recovery/Trax.Samples.Recovery.Client), its own
  # npm project. It builds the engine from Trax.Api.StateMachine/src, which is upstream of
  # Trax.Samples through Trax.Cli, so it runs whenever the Samples job does. Besides its lint, tests
  # and build, it regenerates the topic map's twin from the C# machine with `trax machine generate`,
  # as the sample's README says to, and fails when that changes a file: a twin out of step with the
  # machine would let the page offer moves the server refuses.
  recovery-client:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'Trax.Samples')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLIENT: Trax.Samples/samples/Recovery/Trax.Samples.Recovery.Client
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install Trax.Api.StateMachine (locked, no install scripts)
        # The twin generator runs under node from this folder's tools.
        working-directory: Trax.Api.StateMachine
        run: npm ci --ignore-scripts
      - name: Install (locked, no install scripts)
        working-directory: ${{ env.CLIENT }}
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: ${{ env.CLIENT }}
        run: npm run lint
      - name: Test
        working-directory: ${{ env.CLIENT }}
        run: npm test
      - name: Build
        # tsc -b typechecks it, then vite builds it.
        working-directory: ${{ env.CLIENT }}
        run: npm run build
      - name: Audit runtime dependencies
        working-directory: ${{ env.CLIENT }}
        run: npm audit --omit=dev --audit-level=high
      - name: The topic map's twin matches the C# machine
        run: |
          dotnet restore Trax.Samples/samples/Recovery/Trax.Samples.Recovery --locked-mode
          dotnet restore Trax.Cli/src/Trax.Cli --locked-mode
          dotnet build Trax.Samples/samples/Recovery/Trax.Samples.Recovery --configuration Release --no-restore
          out="$CLIENT/src/topicMap"
          dotnet run --project Trax.Cli/src/Trax.Cli --no-restore -- machine generate \
            --assembly Trax.Samples/samples/Recovery/Trax.Samples.Recovery/bin/Release/net10.0/Trax.Samples.Recovery.dll \
            --machine Trax.Samples.Recovery.Machines.TopicMapMachine \
            --ir-out "$out" --twin-out "$out" \
            --engine-src Trax.Api.StateMachine/src --import-style specifier
          # Only the generated files: the folder also holds the page's own hook.
          if [ -n "$(git status --porcelain -- "$out/topic-map.*")" ]; then
            git --no-pager diff -- "$out/topic-map.*"
            echo "::error::The topic map's twin is out of date. Regenerate it with the command in Trax.Samples/samples/Recovery/README.md and commit the result."
            exit 1
          fi

  # The TypeScript twin of Trax.Effect.StateMachine. Its machines/ corpus is also read by the
  # Trax.Effect conformance tests and the Trax.Cli byte-parity tests, which is why those
  # folders list it upstream.
  state-machine:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.folders), 'Trax.Api.StateMachine')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Trax.Api.StateMachine
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install (locked, no install scripts)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # The only check branch protection requires. It runs whatever happened above, and fails
  # when any job that ran failed or was cancelled; a job skipped by change detection passes.
  # The coverage upload is not among them: it is information, and it never fails a run.
  result:
    name: CI result
    needs: [changes, dotnet, adr-guard, website, website-dashboard, recovery-client, state-machine]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done
