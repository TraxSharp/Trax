name: 'Trax ADR Guard'
description: >-
  Validates one folder's architecture decision records: frontmatter, index agreement,
  lifecycle, exemplars and hygiene. The checks read only that folder; the guard itself is
  built from Trax.Docs/tools/Trax.Adr.Guard in the same checkout.

inputs:
  folder:
    description: 'The folder whose corpus is checked, relative to the repository root (e.g. Trax.Core).'
    required: true
  adr-root:
    description: 'ADR directory, relative to the folder.'
    required: false
    default: 'docs/adr'
  test-roots:
    description: 'Comma-separated folders, relative to the folder, scanned for the guard classes an ADR names as exemplars.'
    required: false
    default: 'tests'
  known-areas:
    description: >-
      Comma-separated closed vocabulary for the "areas" key. Required: the vocabulary is
      closed on purpose, because one that grows freely stops discriminating.
    required: true
  known-repos:
    description: 'Comma-separated closed vocabulary for the "repos" key. Central corpus only.'
    required: false
    default: ''
  require-repos-key:
    description: >-
      "true" for the central corpus in Trax.Docs, where "repos" says which repos must obey.
      Leave false in a repo-local corpus, where the path already says it.
    required: false
    default: 'false'
  census-root:
    description: >-
      Folder whose every guard class must be credited to an ADR or opt out with a reason.
      Empty disables the census.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        global-json-file: global.json

    - name: Check ADRs
      shell: bash
      # Inputs are bound through the environment rather than interpolated into the script,
      # so nothing a caller passes can reach the shell as code.
      env:
        FOLDER: ${{ inputs.folder }}
        ADR_ROOT: ${{ inputs.adr-root }}
        TEST_ROOTS: ${{ inputs.test-roots }}
        KNOWN_AREAS: ${{ inputs.known-areas }}
        KNOWN_REPOS: ${{ inputs.known-repos }}
        REQUIRE_REPOS_KEY: ${{ inputs.require-repos-key }}
        CENSUS_ROOT: ${{ inputs.census-root }}
      run: |
        set -euo pipefail

        args=(
          --repo "${GITHUB_WORKSPACE}/${FOLDER}"
          --adr-root "${ADR_ROOT}"
          --test-roots "${TEST_ROOTS}"
          --known-areas "${KNOWN_AREAS}"
        )

        # Written as if-blocks, not '[ ... ] && ...': under 'set -e' a false test is a
        # failing list, and the script would exit instead of skipping the argument.
        if [ -n "${KNOWN_REPOS}" ]; then
          args+=(--known-repos "${KNOWN_REPOS}")
        fi

        if [ -n "${CENSUS_ROOT}" ]; then
          args+=(--census-root "${CENSUS_ROOT}")
        fi

        if [ "${REQUIRE_REPOS_KEY}" = "true" ]; then
          args+=(--require-repos-key)
        fi

        # Run from Trax.Docs so its Directory.Build.props and Directory.Packages.props apply,
        # not the checked folder's. The restore is locked against the guard's committed
        # lockfile, and the run does not restore again.
        cd "${GITHUB_WORKSPACE}/Trax.Docs"
        dotnet restore tools/Trax.Adr.Guard --locked-mode
        dotnet run --project tools/Trax.Adr.Guard --configuration Release --no-restore -- "${args[@]}"
