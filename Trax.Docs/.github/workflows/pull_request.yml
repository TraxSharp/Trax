name: Pull Request

on:
  pull_request:
    branches: [main]

# Default to no permissions; the job widens only what it needs.
permissions: {}

jobs:
  doc-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Guard against local-dev lockfile versions
        run: |
          if grep -rln '"resolved": "1.99.99"' --include=packages.lock.json . ; then
            echo "::error::A packages.lock.json contains the local-dev version 1.99.99. Regenerate lockfiles in CI mode (remove trax-local.props) before committing."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Every project is locked
        run: .github/scripts/check-project-locks.sh Trax.Docs.slnx

      - name: No deprecated packages
        run: .github/scripts/check-deprecated-packages.sh Trax.Docs.slnx

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build

  # The ADR corpus here binds every repo, so it is checked the same way the repo-local
  # corpora are: through the composite action this repo also publishes to the others.
  # That means a second Release build of a project doc-lint already built. The duplication
  # is the point: this job is the only place the action itself is exercised before another
  # repo depends on it.
  adr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check ADRs
        # The local path is the point: this runs the action as the pull request changes it.
        uses: ./.github/actions/adr-guard  # zizmor: ignore[self-repository]
        with:
          adr-root: adr
          known-areas: testing,platform,packaging,ci,naming,data-model,graphql,docs,migrations,providers
          known-repos: core,effect,mediator,scheduler,dashboard,api,cli,samples,docs,website
          require-repos-key: 'true'
          # Scoped to the project that holds this repo's guards. Trax.Adr.Guard.Tests is a
          # tool's unit tests, not guards over the repo, so censusing it would only produce
          # a dozen identical opt-outs.
          census-root: tests/Trax.Docs.Tests
