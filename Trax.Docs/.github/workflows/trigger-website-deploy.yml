name: Trigger Website Deploy

on:
  push:
    branches: [main]
    # The ADR corpus and the guard that checks it are engineering record, not published
    # documentation, so a commit touching only those has nothing for the site to rebuild.
    paths-ignore:
      - 'adr/**'
      - '.claude/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/**'

# The deploy job calls no GitHub API; it needs no token permissions.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Gate production deploys behind a protected environment.
    # Must be configured in repo Settings -> Environments.
    environment: website-deploy
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Trigger Vercel deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -s -X POST "$DEPLOY_HOOK"
