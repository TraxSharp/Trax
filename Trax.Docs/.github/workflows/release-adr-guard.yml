name: Release ADR Guard

# Cuts a vX.Y.Z tag and a GitHub release for the adr-guard composite action, so Dependabot's
# github-actions ecosystem in the code repos sees a new version and opens the PR that moves
# their pin. Manual, like every other Trax release: nothing is tagged on merge. See
# adr/0038-the-adr-guard-is-released-by-tag.md for the tag scheme and what each bump means.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          patch: a fix that fails no corpus the last release passed. minor: a new or stricter
          check, which can fail a corpus that passed. major: an input removed, renamed or
          given a different default.
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-adr-guard
  cancel-in-progress: false

# Default to no permissions; each job widens only what it needs.
permissions: {}

jobs:
  # Untrusted-code zone: build and test the guard with no write credentials.
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore tests/Trax.Adr.Guard.Tests --locked-mode

      - name: Build
        run: dotnet build tests/Trax.Adr.Guard.Tests --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/Trax.Adr.Guard.Tests --configuration Release --no-build

  # Release zone: holds contents: write, and waits on the protected environment so a dispatch
  # cannot cut a tag before an approver signs off.
  tag:
    needs: test
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # What the action runs. A commit touching none of these changes nothing a caller
          # gets, and a tag for it would only open eight empty Dependabot PRs.
          paths=(.github/actions/adr-guard tools/Trax.Adr.Guard global.json Directory.Build.props Directory.Packages.props)

          last="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "${last}" ]; then
            next="v1.0.0"
            echo "First tagged release of the adr-guard action." > notes.md
          else
            if [ -z "$(git log --format=%H "${last}..HEAD" -- "${paths[@]}")" ]; then
              echo "::error::Nothing under ${paths[*]} changed since ${last}. There is no guard release to cut."
              exit 1
            fi

            IFS=. read -r major minor patch <<< "${last#v}"
            case "${BUMP}" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
            esac

            {
              echo "Changes to the adr-guard action since ${last}:"
              echo
              git log --format='- %s (%h)' "${last}..HEAD" -- "${paths[@]}"
            } > notes.md
          fi

          gh release create "${next}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "adr-guard ${next}" \
            --notes-file notes.md

          echo "Released ${next} at ${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"
