version: 2
updates:
  - package-ecosystem: "nuget"
    # Directory.Packages.props at the root pins every package; the lockfiles sit beside each project.
    directory: "/"
    schedule: { interval: "weekly" }
    # A release gets a week on nuget.org before a bot proposes it, so a hijacked
    # version is usually caught and pulled first. Security updates are not delayed
    # by this.
    cooldown: { default-days: 7 }
    # Three at a time. A bump that needs a human costs a review either way, and
    # ten open at once only made the pile deeper than the week's attention span.
    open-pull-requests-limit: 3
    groups:
      # Group only minor + patch; major bumps get their own reviewable PRs.
      nuget-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["Trax.*"]
        update-types: ["minor", "patch"]
      # The published Trax releases that tests/Trax.Docs.Snippets.Tests compiles the docs'
      # snippets against, pinned in Directory.Packages.props. On their own because a bump is also
      # a docs change: the pages show the pinned versions, so DocsPackageVersionsTests fails the PR
      # until they are updated, and any snippet the new release breaks fails beside it. That is a
      # page to fix, not a bump to merge blind, and grouped in it would hold the week's other bumps
      # hostage.
      trax:
        patterns: ["Trax.*"]
        update-types: ["minor", "patch"]
    ignore:
      # A Trax major is a deliberate migration, never a bot PR. This also keeps
      # Dependabot away from the unlisted 2.0.0 packages that still sit on
      # nuget.org for trax.core and trax.scheduler: unlisted versions stay
      # resolvable, so a major-update proposal could walk straight into one.
      - dependency-name: "Trax.*"
        update-types: ["version-update:semver-major"]
      # The tools whose bump invalidates something committed beside them. Each has
      # to move in one commit with the artefact it regenerates, which a bot PR
      # cannot do -- it bumps the tool and leaves the check failing, every time.
      # Bump these by hand.
      #
      # csharpier lives in .config/dotnet-tools.json, and a minor bump changes how
      # it formats: bump it and run `dotnet csharpier format .` in one commit.
      - dependency-name: "csharpier"
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only; the composite actions this repo publishes pin their own steps.
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
