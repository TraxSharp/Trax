  <path d="M528,137 L570,137" fill="none" stroke="#686560" stroke-width="1.5" marker-end="url(#a686560)"/>
  <rect x="574" y="80" width="178" height="70" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
