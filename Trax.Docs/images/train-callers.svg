  <path d="M184,95 C220,95 222,137 252,137" fill="none" stroke="#686560" stroke-width="1.5"/>
  <rect x="16" y="120" width="168" height="34" rx="6" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="30" y="142" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:400;fill:#e4e2de">the scheduler</text>
  <path d="M184,137 L254,137" fill="none" stroke="#686560" stroke-width="1.5" marker-end="url(#a686560)"/>
  <rect x="16" y="162" width="168" height="34" rx="6" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="30" y="184" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:400;fill:#e4e2de">a worker process</text>
