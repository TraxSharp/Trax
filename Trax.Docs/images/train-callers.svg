  <rect x="16" y="204" width="168" height="34" rx="6" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="30" y="226" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:400;fill:#e4e2de">a state machine</text>
  <path d="M184,221 C220,221 222,137 252,137" fill="none" stroke="#686560" stroke-width="1.5"/>
  <text x="260" y="26" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#7fb0e0;letter-spacing:1px">ONE TRAIN</text>
