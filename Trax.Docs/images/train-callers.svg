  <text x="16" y="26" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96;letter-spacing:1px">CALLERS</text>
  <rect x="16" y="36" width="168" height="34" rx="6" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="30" y="58" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:400;fill:#e4e2de">your code</text>
