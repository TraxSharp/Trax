  <rect x="360" y="118" width="70" height="38" rx="6" fill="#1e1e1e" stroke="#f2a7c3" stroke-width="1.5"/>
  <text x="395" y="142" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#e4e2de">junction</text>
  <rect x="444" y="118" width="70" height="38" rx="6" fill="#1e1e1e" stroke="#f2a7c3" stroke-width="1.5"/>
