  <text x="176" y="218" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">= Moves</text>
  <text x="176" y="242" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">The only ways from</text>
  <text x="176" y="258" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">station to station.</text>
  <rect x="312" y="168" width="144" height="118" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
