  <text x="324" y="194" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#f2c94c;letter-spacing:1px">SIGNALS</text>
  <text x="324" y="218" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">= Guards</text>
  <text x="324" y="242" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">Checks a move must</text>
  <text x="324" y="258" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">pass first.</text>
  <rect x="460" y="168" width="144" height="118" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <rect x="460" y="168" width="144" height="5" rx="2" fill="#7fb0e0"/>
  <text x="472" y="194" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#7fb0e0;letter-spacing:1px">TRAINS</text>
  <text x="472" y="218" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">= The work</text>
  <text x="472" y="242" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">Runs without</text>
  <text x="472" y="258" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">stopping to the</text>
  <text x="472" y="274" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">next station.</text>
  <rect x="608" y="168" width="144" height="118" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <rect x="608" y="168" width="144" height="5" rx="2" fill="#f2a7c3"/>
  <text x="620" y="194" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#f2a7c3;letter-spacing:1px">JUNCTIONS</text>
  <text x="620" y="218" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">= Steps</text>
