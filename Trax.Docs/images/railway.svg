<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 302" width="768" height="302" role="img" aria-labelledby="title">
  <title id="title">The railway picture. Stations Cart, Address, Payment, Placing and Placed sit on a track. A signal stands before Placing. The PlaceOrder train has left Placing and passes junctions on its way to Placed. Stations are states, tracks are moves, signals are guards, trains are the work, junctions are its steps.</title>
