  <line x1="420" y1="48" x2="420" y2="68" stroke="#a09d96" stroke-width="2.5"/>
  <rect x="412" y="22" width="16" height="28" rx="5" fill="#101010" stroke="#a09d96" stroke-width="1.2"/>
  <circle cx="420" cy="30" r="4" fill="#f2c94c"/>
  <circle cx="420" cy="41" r="4" fill="#333"/>
