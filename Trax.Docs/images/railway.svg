  <circle cx="170" cy="92" r="9" fill="#151515" stroke="#5fc9b5" stroke-width="3"/>
  <text x="170" y="124" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#5fc9b5">Address</text>
  <circle cx="300" cy="92" r="9" fill="#151515" stroke="#5fc9b5" stroke-width="3"/>
