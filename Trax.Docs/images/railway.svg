  <rect x="529" y="87" width="15" height="8" rx="2" fill="#151515" stroke="#151515" stroke-width="0"/>
  <rect x="550" y="87" width="15" height="8" rx="2" fill="#151515" stroke="#151515" stroke-width="0"/>
  <text x="540" y="70" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#7fb0e0">PlaceOrder train</text>
  <text x="650" y="124" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2a7c3">junctions</text>
