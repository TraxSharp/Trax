  <text x="28" y="258" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">waits for someone.</text>
  <rect x="164" y="168" width="144" height="118" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
