<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" role="img" aria-labelledby="title">
  <title id="title">The book's checkout drawn as a railway map. The main line runs Cart, Address, Payment, Placing, Placed, with the moves SetAddress, ChoosePayment and PlaceOrder between them and a guard before each. Placing runs the PlaceOrder train; if it fails the checkout goes to Failed, and Retry goes back to Placing. The customer is at Address.</title>
  <rect width="768" height="300" fill="#151515"/>
  <path d="M24,110 L744,110" fill="none" stroke="#262626" stroke-width="18" stroke-dasharray="4 9"/>
  <path d="M24,110 L744,110" fill="none" stroke="#b4a7f5" stroke-width="3"/>
  <path d="M478,122 L478,228" fill="none" stroke="#262626" stroke-width="18" stroke-dasharray="4 9"/>
  <path d="M478,122 L478,228" fill="none" stroke="#e8853d" stroke-width="3"/>
  <path d="M500,228 L500,122" fill="none" stroke="#b4a7f5" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="117" y="96" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#b4a7f5">SetAddress</text>
  <text x="262" y="96" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#b4a7f5">ChoosePayment</text>
  <text x="407" y="96" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#b4a7f5">PlaceOrder</text>
  <line x1="180" y1="46" x2="180" y2="66" stroke="#a09d96" stroke-width="2.5"/>
  <rect x="172" y="20" width="16" height="28" rx="5" fill="#101010" stroke="#a09d96" stroke-width="1.2"/>
  <circle cx="180" cy="28" r="4" fill="#f2c94c"/>
  <circle cx="180" cy="39" r="4" fill="#333"/>
  <line x1="320" y1="46" x2="320" y2="66" stroke="#a09d96" stroke-width="2.5"/>
  <rect x="312" y="20" width="16" height="28" rx="5" fill="#101010" stroke="#a09d96" stroke-width="1.2"/>
  <circle cx="320" cy="28" r="4" fill="#f2c94c"/>
  <circle cx="320" cy="39" r="4" fill="#333"/>
  <line x1="468" y1="46" x2="468" y2="66" stroke="#a09d96" stroke-width="2.5"/>
  <rect x="460" y="20" width="16" height="28" rx="5" fill="#101010" stroke="#a09d96" stroke-width="1.2"/>
  <circle cx="468" cy="28" r="4" fill="#f2c94c"/>
  <circle cx="468" cy="39" r="4" fill="#333"/>
  <text x="16" y="24" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2c94c">signals = guards</text>
  <circle cx="200" cy="110" r="17" fill="none" stroke="#5fc9b5" stroke-width="1.5"/>
  <text x="200" y="164" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#5fc9b5">you are here</text>
  <rect x="560" y="99" width="72" height="22" rx="6" fill="#7fb0e0" stroke="#7fb0e0" stroke-width="1"/>
  <rect x="568" y="105" width="12" height="8" rx="2" fill="#151515" stroke="#151515" stroke-width="0"/>
  <rect x="586" y="105" width="12" height="8" rx="2" fill="#151515" stroke="#151515" stroke-width="0"/>
  <rect x="604" y="105" width="12" height="8" rx="2" fill="#151515" stroke="#151515" stroke-width="0"/>
  <text x="596" y="88" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#7fb0e0">PlaceOrder</text>
  <line x1="652" y1="100" x2="652" y2="120" stroke="#f2a7c3" stroke-width="4"/>
  <line x1="680" y1="100" x2="680" y2="120" stroke="#f2a7c3" stroke-width="4"/>
  <circle cx="50" cy="110" r="9" fill="#151515" stroke="#5fc9b5" stroke-width="3"/>
  <text x="50" y="144" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#5fc9b5">Cart</text>
  <circle cx="200" cy="110" r="9" fill="#5fc9b5" stroke="#5fc9b5" stroke-width="3"/>
  <text x="200" y="144" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#5fc9b5">Address</text>
  <circle cx="340" cy="110" r="9" fill="#151515" stroke="#5fc9b5" stroke-width="3"/>
  <text x="340" y="144" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#5fc9b5">Payment</text>
  <circle cx="490" cy="110" r="9" fill="#151515" stroke="#5fc9b5" stroke-width="3"/>
  <text x="466" y="144" text-anchor="end" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#5fc9b5">Placing</text>
  <circle cx="724" cy="110" r="9" fill="#5fc9b5" stroke="#5fc9b5" stroke-width="3"/>
  <text x="724" y="144" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:600;fill:#e4e2de">Placed</text>
  <text x="470" y="184" text-anchor="end" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#e8853d">run failed</text>
  <text x="508" y="184" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#b4a7f5">Retry</text>
  <circle cx="489" cy="240" r="9" fill="#151515" stroke="#e8853d" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="510" y="245" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e8853d">Failed</text>
  <text x="16" y="288" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Anything not drawn here is not a move, and the server refuses it.</text>
</svg>
