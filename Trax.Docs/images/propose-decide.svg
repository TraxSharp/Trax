<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 372" width="768" height="372" role="img" aria-labelledby="title">
  <title id="title">Outside Trax, a browser, a script and an AI agent each send a move, never the new state; the client code is yours or generated by Trax. Everything inside the dashed line is Trax. The move arrives through Trax's API, which knows who is calling. Trax then checks it against the stored state: is the move allowed from here, which Trax decides alone; may this caller make it, by rules you write; and do the data and evidence hold up, by guards you write. All three pass and Trax saves the new state and runs the work you wrote. Any one fails and the client gets a code such as GUARD_FAILED or FORBIDDEN with your reason, and nothing changes.</title>
  <defs><marker id="ab4a7f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4a7f5"/></marker><marker id="a5fc9b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fc9b5"/></marker><marker id="ae8853d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8853d"/></marker></defs>
<rect width="768" height="372" fill="#151515"/>
  <text x="16" y="40" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96;letter-spacing:1px">OUTSIDE TRAX</text>
  <rect x="16" y="56" width="140" height="48" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="30" y="85" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:400;fill:#e4e2de">A browser</text>
  <rect x="16" y="124" width="140" height="48" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="30" y="153" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:400;fill:#e4e2de">A script</text>
  <rect x="16" y="192" width="140" height="48" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="30" y="221" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:400;fill:#e4e2de">An AI agent</text>
  <text x="16" y="266" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#b4a7f5">Your client code, or</text>
  <text x="16" y="282" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#b4a7f5">one Trax generates.</text>
  <text x="16" y="298" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#b4a7f5">Each sends a move,</text>
  <text x="16" y="314" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#b4a7f5">never the new state.</text>
  <rect x="172" y="16" width="580" height="314" rx="12" fill="#191919" stroke="#686560" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="188" y="40" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96;letter-spacing:1px">INSIDE TRAX</text>
  <path d="M156,80 C174,80 172,148 190,148" fill="none" stroke="#b4a7f5" stroke-width="1.5"/>
  <path d="M156,148 L190,148" fill="none" stroke="#b4a7f5" stroke-width="1.5"/>
  <path d="M156,216 C174,216 172,148 190,148" fill="none" stroke="#b4a7f5" stroke-width="1.5"/>
  <rect x="190" y="118" width="80" height="60" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="230" y="143" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:600;fill:#e4e2de">API + auth</text>
  <text x="230" y="162" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">who calls?</text>
  <path d="M270,148 L288,148" fill="none" stroke="#b4a7f5" stroke-width="1.5" marker-end="url(#ab4a7f5)"/>
  <rect x="292" y="56" width="264" height="232" rx="10" fill="#1b1a14" stroke="#f2c94c" stroke-width="1.5"/>
  <text x="308" y="82" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">Trax checks every move</text>
  <text x="308" y="100" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">against the state it stored</text>
  <circle cx="316" cy="128" r="10" fill="#f2c94c"/>
  <text x="316" y="132" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:600;fill:#151515">1</text>
  <text x="334" y="132" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">Is this move allowed from here?</text>
  <text x="334" y="155" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#a09d96">Trax does this</text>
  <circle cx="316" cy="182" r="10" fill="#f2c94c"/>
  <text x="316" y="186" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:600;fill:#151515">2</text>
  <text x="334" y="186" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">May this caller make it?</text>
  <rect x="334" y="195" width="190.20000000000002" height="22" rx="5" fill="#2f2810" stroke="#f2c94c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="342" y="210" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2c94c">you write: who may send it</text>
  <circle cx="316" cy="236" r="10" fill="#f2c94c"/>
  <text x="316" y="240" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:600;fill:#151515">3</text>
  <text x="334" y="240" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">Do the data and evidence hold?</text>
  <rect x="334" y="249" width="156.70000000000002" height="22" rx="5" fill="#2f2810" stroke="#f2c94c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="342" y="264" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2c94c">you write: the guards</text>
  <path d="M556,116 L572,116" fill="none" stroke="#5fc9b5" stroke-width="1.5" marker-end="url(#a5fc9b5)"/>
  <path d="M556,240 L572,240" fill="none" stroke="#e8853d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ae8853d)"/>
  <rect x="572" y="56" width="168" height="124" rx="8" fill="#12302b" stroke="#5fc9b5" stroke-width="1.5"/>
  <text x="586" y="80" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#5fc9b5">Accepted</text>
  <text x="586" y="100" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">Trax saves the</text>
  <text x="586" y="116" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">new state.</text>
  <rect x="586" y="128" width="128" height="38" rx="5" fill="#2f2810" stroke="#f2c94c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="594" y="143" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2c94c">you write:</text>
  <text x="594" y="159" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2c94c">the work it runs</text>
  <rect x="572" y="192" width="168" height="124" rx="8" fill="#33200f" stroke="#e8853d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="586" y="216" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e8853d">Refused</text>
  <text x="586" y="238" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#e8853d">GUARD_FAILED</text>
  <text x="586" y="254" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#e8853d">FORBIDDEN</text>
  <text x="586" y="278" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">A code and your reason.</text>
  <text x="586" y="294" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96">Nothing changes.</text>
  <rect x="16" y="344" width="78" height="22" rx="5" fill="#2f2810" stroke="#f2c94c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="24" y="359" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2c94c">you write</text>
  <text x="106" y="359" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">Code you write, as are the clients. Everything else inside the line is Trax.</text>
</svg>
