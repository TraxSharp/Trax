<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 306" width="768" height="306" role="img" aria-labelledby="title">
  <title id="title">The PlaceOrder train runs four junctions in order: PriceCart, ReserveStock, TakePayment and ConfirmOrder. When all succeed the caller gets the order. When ReserveStock fails because an item is out of stock, TakePayment and ConfirmOrder are skipped, no card is charged, and the caller gets the exception. Each junction is code you write; Trax runs them in order, skips the rest when one fails, and records the run.</title>
  <defs><marker id="a7fb0e0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fb0e0"/></marker></defs>
<rect width="768" height="306" fill="#151515"/>
  <text x="16" y="30" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#7fb0e0;letter-spacing:1px">PLACEORDER TRAIN · EVERY JUNCTION SUCCEEDS</text>
  <rect x="16" y="42" width="128" height="66" rx="8" fill="#2e1a24" stroke="#f2a7c3" stroke-width="1.5"/>
  <text x="30" y="70" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#e4e2de">PriceCart</text>
  <text x="30" y="92" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#f2a7c3">done</text>
  <path d="M144,75 L164,75" fill="none" stroke="#7fb0e0" stroke-width="2" marker-end="url(#a7fb0e0)"/>
  <rect x="166" y="42" width="128" height="66" rx="8" fill="#2e1a24" stroke="#f2a7c3" stroke-width="1.5"/>
  <text x="180" y="70" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#e4e2de">ReserveStock</text>
  <text x="180" y="92" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#f2a7c3">done</text>
  <path d="M294,75 L314,75" fill="none" stroke="#7fb0e0" stroke-width="2" marker-end="url(#a7fb0e0)"/>
  <rect x="316" y="42" width="128" height="66" rx="8" fill="#2e1a24" stroke="#f2a7c3" stroke-width="1.5"/>
  <text x="330" y="70" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#e4e2de">TakePayment</text>
  <text x="330" y="92" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#f2a7c3">done</text>
  <path d="M444,75 L464,75" fill="none" stroke="#7fb0e0" stroke-width="2" marker-end="url(#a7fb0e0)"/>
  <rect x="466" y="42" width="128" height="66" rx="8" fill="#2e1a24" stroke="#f2a7c3" stroke-width="1.5"/>
  <text x="480" y="70" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#e4e2de">ConfirmOrder</text>
  <text x="480" y="92" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#f2a7c3">done</text>
  <path d="M594,75 L614,75" fill="none" stroke="#7fb0e0" stroke-width="2" marker-end="url(#a7fb0e0)"/>
  <rect x="616" y="42" width="136" height="66" rx="8" fill="#16243a" stroke="#7fb0e0" stroke-width="1.5"/>
  <text x="630" y="70" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#7fb0e0">The order</text>
  <text x="630" y="92" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">back to the caller</text>
  <text x="16" y="146" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#e8853d;letter-spacing:1px">PLACEORDER TRAIN · ONE JUNCTION FAILS</text>
  <rect x="16" y="158" width="128" height="66" rx="8" fill="#2e1a24" stroke="#f2a7c3" stroke-width="1.5"/>
  <text x="30" y="186" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#e4e2de">PriceCart</text>
  <text x="30" y="208" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#f2a7c3">done</text>
  <path d="M144,191 L164,191" fill="none" stroke="#7fb0e0" stroke-width="2" marker-end="url(#a7fb0e0)"/>
  <rect x="166" y="158" width="128" height="66" rx="8" fill="#33200f" stroke="#e8853d" stroke-width="2.5"/>
  <text x="180" y="186" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#e4e2de">ReserveStock</text>
  <text x="180" y="208" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e8853d">out of stock</text>
  <path d="M294,191 L314,191" fill="none" stroke="#e8853d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="316" y="158" width="128" height="66" rx="8" fill="none" stroke="#3a3a37" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="330" y="186" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:400;fill:#686560">TakePayment</text>
  <text x="330" y="208" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#686560">skipped</text>
  <path d="M444,191 L464,191" fill="none" stroke="#e8853d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="466" y="158" width="128" height="66" rx="8" fill="none" stroke="#3a3a37" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="480" y="186" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:400;fill:#686560">ConfirmOrder</text>
  <text x="480" y="208" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#686560">skipped</text>
  <path d="M594,191 L614,191" fill="none" stroke="#e8853d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="616" y="158" width="136" height="66" rx="8" fill="#33200f" stroke="#e8853d" stroke-width="1.5"/>
  <text x="630" y="186" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:600;fill:#e8853d">The exception</text>
  <text x="630" y="208" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">back to the caller</text>
  <text x="16" y="254" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">No card is charged for an order that cannot be filled, and the run record names the junction that failed.</text>
  <rect x="16" y="274" width="176.8" height="22" rx="5" fill="#2f2810" stroke="#f2c94c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="24" y="289" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#f2c94c">you write: each junction</text>
  <text x="210" y="289" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">Trax runs them in order, skips the rest when one fails, and records the run.</text>
</svg>
