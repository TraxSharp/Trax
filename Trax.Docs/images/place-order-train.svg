<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 268" width="768" height="268" role="img" aria-labelledby="title">
  <title id="title">The PlaceOrder train runs four junctions in order: PriceCart, ReserveStock, TakePayment and ConfirmOrder. When all succeed the caller gets the order. When ReserveStock fails because an item is out of stock, TakePayment and ConfirmOrder are skipped, no card is charged, and the caller gets the exception.</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e4e2de; font-size: 14px; }
    .muted { fill: #a09d96; font-size: 13px; }
    .label { fill: #a09d96; font-size: 12px; letter-spacing: 1px; }
    .box { fill: #1e1e1e; stroke: #686560; stroke-width: 1.5; }
    .line { stroke: #686560; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#686560"/>
    </marker>
  </defs>
  <rect width="768" height="268" fill="#151515"/>

  <text x="16" y="30" class="label">WHEN EVERY JUNCTION SUCCEEDS</text>
  <rect x="16" y="42" width="128" height="66" rx="8" class="box"/>
  <text x="30" y="70" font-weight="600">PriceCart</text>
  <text x="30" y="92" class="muted">done</text>
  <path d="M144,75 L164,75" class="line" marker-end="url(#arrow)"/>
  <rect x="166" y="42" width="128" height="66" rx="8" class="box"/>
  <text x="180" y="70" font-weight="600">ReserveStock</text>
  <text x="180" y="92" class="muted">done</text>
  <path d="M294,75 L314,75" class="line" marker-end="url(#arrow)"/>
  <rect x="316" y="42" width="128" height="66" rx="8" class="box"/>
  <text x="330" y="70" font-weight="600">TakePayment</text>
  <text x="330" y="92" class="muted">done</text>
  <path d="M444,75 L464,75" class="line" marker-end="url(#arrow)"/>
  <rect x="466" y="42" width="128" height="66" rx="8" class="box"/>
  <text x="480" y="70" font-weight="600">ConfirmOrder</text>
  <text x="480" y="92" class="muted">done</text>
  <path d="M594,75 L614,75" class="line" marker-end="url(#arrow)"/>
  <rect x="616" y="42" width="136" height="66" rx="8" fill="#1a2e18" stroke="#5cb85c" stroke-width="1.5"/>
  <text x="630" y="70" font-weight="600" style="fill:#5cb85c">The order</text>
  <text x="630" y="92" class="muted">back to the caller</text>

  <text x="16" y="146" class="label" style="fill:#c45c5c">WHEN ONE FAILS</text>
  <rect x="16" y="158" width="128" height="66" rx="8" class="box"/>
  <text x="30" y="186" font-weight="600">PriceCart</text>
  <text x="30" y="208" class="muted">done</text>
  <path d="M144,191 L164,191" class="line" marker-end="url(#arrow)"/>
  <rect x="166" y="158" width="128" height="66" rx="8" fill="#2e1616" stroke="#c45c5c" stroke-width="2.5"/>
  <text x="180" y="186" font-weight="600">ReserveStock</text>
  <text x="180" y="208" class="muted" style="fill:#c45c5c">out of stock</text>
  <path d="M294,191 L314,191" stroke="#c45c5c" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <rect x="316" y="158" width="128" height="66" rx="8" fill="none" stroke="#3a3a37" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="330" y="186" style="fill:#686560">TakePayment</text>
  <text x="330" y="208" class="muted" style="fill:#686560">skipped</text>
  <path d="M444,191 L464,191" stroke="#c45c5c" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <rect x="466" y="158" width="128" height="66" rx="8" fill="none" stroke="#3a3a37" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="480" y="186" style="fill:#686560">ConfirmOrder</text>
  <text x="480" y="208" class="muted" style="fill:#686560">skipped</text>
  <path d="M594,191 L614,191" stroke="#c45c5c" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <rect x="616" y="158" width="136" height="66" rx="8" fill="#2e1616" stroke="#c45c5c" stroke-width="1.5"/>
  <text x="630" y="186" font-weight="600" style="fill:#c45c5c">The exception</text>
  <text x="630" y="208" class="muted">back to the caller</text>

  <text x="16" y="254" class="muted">No card is charged for an order that cannot be filled, and the run record names the junction that failed.</text>
</svg>
