<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 250" width="768" height="250" role="img" aria-labelledby="title">
  <title id="title">A run's timeline: it starts, PriceCart and ReserveStock finish, a checkpoint is saved, the process crashes, and the run resumes from the checkpoint instead of starting over, then finishes. Every step is recorded in your Postgres and shown in the operations console.</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e4e2de; font-size: 14px; }
    .muted { fill: #a09d96; font-size: 13px; }
    .head { font-size: 15px; font-weight: 600; }
    .card { fill: #1e1e1e; stroke: #2a2a28; stroke-width: 1.5; }
  </style>
  <rect width="768" height="250" fill="#151515"/>

  <line x1="40" y1="80" x2="728" y2="80" stroke="#686560" stroke-width="2"/>
  <line x1="438" y1="80" x2="560" y2="80" stroke="#151515" stroke-width="4" stroke-dasharray="4 6"/>

  <circle cx="48" cy="80" r="8" fill="#e4e2de"/>
  <text x="48" y="56" text-anchor="middle">Started</text>

  <circle cx="160" cy="80" r="8" fill="#e4e2de"/>
  <text x="160" y="112" text-anchor="middle" class="muted">PriceCart done</text>

  <circle cx="280" cy="80" r="8" fill="#e4e2de"/>
  <text x="280" y="112" text-anchor="middle" class="muted">ReserveStock done</text>

  <rect x="371" y="71" width="18" height="18" fill="#7a9ec2"/>
  <text x="380" y="56" text-anchor="middle" style="fill:#7a9ec2;font-weight:600">Checkpoint</text>

  <path d="M486,68 L510,92 M510,68 L486,92" stroke="#c45c5c" stroke-width="3.5"/>
  <text x="498" y="56" text-anchor="middle" style="fill:#c45c5c;font-weight:600">Crash</text>

  <circle cx="610" cy="80" r="9" fill="#151515" stroke="#7a9ec2" stroke-width="3"/>
  <text x="610" y="112" text-anchor="middle" style="fill:#7a9ec2;font-weight:600">Resumed here</text>

  <circle cx="720" cy="80" r="9" fill="#5cb85c"/>
  <text x="720" y="56" text-anchor="middle">Finished</text>

  <rect x="16" y="146" width="236" height="90" rx="8" class="card"/>
  <text x="32" y="172" class="head">What is recorded</text>
  <text x="32" y="196" class="muted">Start, end, input, output, and</text>
  <text x="32" y="213" class="muted">which junction failed and why.</text>

  <rect x="266" y="146" width="236" height="90" rx="8" class="card"/>
  <text x="282" y="172" class="head">The operations console</text>
  <text x="282" y="196" class="muted">Find a run, read it, requeue it.</text>
  <text x="282" y="213" class="muted">Retries end in dead letters.</text>

  <rect x="516" y="146" width="236" height="90" rx="8" class="card"/>
  <text x="532" y="172" class="head">Recovery</text>
  <text x="532" y="196" class="muted">A resume skips to the checkpoint.</text>
  <text x="532" y="213" class="muted">Recorded decisions are replayed.</text>
</svg>
