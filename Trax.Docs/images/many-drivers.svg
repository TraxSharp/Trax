<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" role="img" aria-labelledby="title">
  <title id="title">One process, defined once on the server, driven by four kinds of client. Browsers get steps in order and checked input. Schedules and queues get retries, dead letters and a record of every run. Scripts and services in any language get the same rules. AI agents get only the moves their role allows, and evidence the server checks itself.</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e4e2de; font-size: 15px; }
    .muted { fill: #a09d96; font-size: 13px; }
    .head { font-size: 15px; font-weight: 600; }
    .card { fill: #1e1e1e; stroke: #2a2a28; stroke-width: 1.5; }
    .line { stroke: #686560; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="768" height="300" fill="#151515"/>

  <path d="M246,72 C290,72 300,130 332,130" class="line"/>
  <path d="M246,228 C290,228 300,170 332,170" class="line"/>
  <path d="M522,72 C478,72 468,130 436,130" class="line"/>
  <path d="M522,228 C478,228 468,170 436,170" class="line"/>

  <rect x="276" y="110" width="216" height="80" rx="10" fill="#1a2e18" stroke="#3d8b37" stroke-width="1.5"/>
  <text x="384" y="140" text-anchor="middle" class="muted" style="fill:#5cb85c">defined once, on the server</text>
  <text x="384" y="168" text-anchor="middle" style="font-size:18px;font-weight:600">Your process</text>

  <rect x="16" y="20" width="230" height="104" rx="8" class="card"/>
  <text x="32" y="48" class="head">Browsers</text>
  <text x="32" y="72" class="muted">Forms, wizards, checkouts.</text>
  <text x="32" y="96" class="muted">Steps in order, input checked</text>
  <text x="32" y="113" class="muted">at every step.</text>

  <rect x="16" y="176" width="230" height="104" rx="8" class="card"/>
  <text x="32" y="204" class="head">Schedules and queues</text>
  <text x="32" y="228" class="muted">Cron, delayed runs, workers.</text>
  <text x="32" y="252" class="muted">Retries, dead letters, and a</text>
  <text x="32" y="269" class="muted">record of every run.</text>

  <rect x="522" y="20" width="230" height="104" rx="8" class="card"/>
  <text x="538" y="48" class="head">Scripts and services</text>
  <text x="538" y="72" class="muted">Any language, one API.</text>
  <text x="538" y="96" class="muted">The same rules, whatever</text>
  <text x="538" y="113" class="muted">they are written in.</text>

  <rect x="522" y="176" width="230" height="104" rx="8" class="card"/>
  <text x="538" y="204" class="head">AI agents</text>
  <text x="538" y="228" class="muted">Working on their own.</text>
  <text x="538" y="252" class="muted">Only the moves their role</text>
  <text x="538" y="269" class="muted">allows; evidence rerun.</text>
</svg>
