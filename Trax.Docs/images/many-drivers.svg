<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" role="img" aria-labelledby="title">
  <title id="title">One workflow, defined once on the server, driven by four kinds of client. Web users get steps in order and valid data at each step. Schedules and queues get retries, dead letters and a record of every run. Scripts and services in any language get the same rules. AI agents get only the moves they are allowed, and evidence the server reruns.</title>
  <rect width="768" height="300" fill="#151515"/>
  <path d="M246,72 C290,72 300,130 332,130" fill="none" stroke="#686560" stroke-width="1.5"/>
  <path d="M246,228 C290,228 300,170 332,170" fill="none" stroke="#686560" stroke-width="1.5"/>
  <path d="M522,72 C478,72 468,130 436,130" fill="none" stroke="#686560" stroke-width="1.5"/>
  <path d="M522,228 C478,228 468,170 436,170" fill="none" stroke="#686560" stroke-width="1.5"/>
  <rect x="276" y="110" width="216" height="80" rx="10" fill="#12302b" stroke="#5fc9b5" stroke-width="2"/>
  <text x="384" y="140" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#5fc9b5">defined once, on the server</text>
  <text x="384" y="168" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:18px;font-weight:600;fill:#e4e2de">Your workflow</text>
  <rect x="16" y="20" width="230" height="104" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="32" y="48" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">Web users</text>
  <text x="32" y="72" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Forms and checkouts.</text>
  <text x="32" y="96" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">Steps in order, valid</text>
  <text x="32" y="113" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">data at each step.</text>
  <rect x="16" y="176" width="230" height="104" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="32" y="204" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">Schedules and queues</text>
  <text x="32" y="228" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Cron, delayed runs, workers.</text>
  <text x="32" y="252" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">Retries, dead letters, and</text>
  <text x="32" y="269" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">a record of every run.</text>
  <rect x="522" y="20" width="230" height="104" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="538" y="48" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">Scripts and services</text>
  <text x="538" y="72" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Integrations, any language.</text>
  <text x="538" y="96" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">The same rules, whatever</text>
  <text x="538" y="113" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">they are written in.</text>
  <rect x="522" y="176" width="230" height="104" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="538" y="204" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">AI agents</text>
  <text x="538" y="228" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Working inside a sandbox.</text>
  <text x="538" y="252" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">Only allowed moves;</text>
  <text x="538" y="269" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#e4e2de">evidence the server reruns.</text>
</svg>
