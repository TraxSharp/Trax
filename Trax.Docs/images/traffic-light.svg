<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 300" width="768" height="300" role="img" aria-labelledby="title">
  <title id="title">A traffic light is a state machine. It is always green, yellow or red. When the timer runs out it moves from green to yellow, yellow to red, and red back to green. Green straight to red is not a move.</title>
  <defs><marker id="ab4a7f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4a7f5"/></marker></defs>
<rect width="768" height="300" fill="#151515"/>
  <rect x="16" y="16" width="480" height="268" rx="10" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <text x="32" y="40" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#a09d96;letter-spacing:1px">EXAMPLE: A TRAFFIC LIGHT</text>
  <rect x="40" y="64" width="128" height="48" rx="8" fill="#12302b" stroke="#5fc9b5" stroke-width="2"/>
  <circle cx="64" cy="88" r="9" fill="#3e9b4f" stroke="#101010" stroke-width="2"/>
  <text x="84" y="93" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">Green</text>
  <rect x="344" y="64" width="128" height="48" rx="8" fill="#12302b" stroke="#5fc9b5" stroke-width="2"/>
  <circle cx="368" cy="88" r="9" fill="#f2c94c" stroke="#101010" stroke-width="2"/>
  <text x="388" y="93" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">Yellow</text>
  <rect x="192" y="212" width="128" height="48" rx="8" fill="#12302b" stroke="#5fc9b5" stroke-width="2"/>
  <circle cx="216" cy="236" r="9" fill="#d2483e" stroke="#101010" stroke-width="2"/>
  <text x="236" y="241" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#e4e2de">Red</text>
  <path d="M168,88 L342,88" fill="none" stroke="#b4a7f5" stroke-width="2" marker-end="url(#ab4a7f5)"/>
  <text x="255" y="80" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#b4a7f5">timer</text>
  <path d="M408,112 C408,180 380,236 322,236" fill="none" stroke="#b4a7f5" stroke-width="2" marker-end="url(#ab4a7f5)"/>
  <text x="410" y="180" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#b4a7f5">timer</text>
  <path d="M190,236 C130,236 104,180 104,114" fill="none" stroke="#b4a7f5" stroke-width="2" marker-end="url(#ab4a7f5)"/>
  <text x="98" y="180" text-anchor="end" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:400;fill:#b4a7f5">timer</text>
  <rect x="176" y="132" width="160" height="52" rx="8" fill="#2f2810" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="256" y="154" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:400;fill:#e4e2de">Green straight to red?</text>
  <text x="256" y="172" text-anchor="middle" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:12px;font-weight:600;fill:#f2c94c">Not a move.</text>
  <rect x="512" y="16" width="240" height="84" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <rect x="512" y="16" width="5" height="84" fill="#5fc9b5"/>
  <text x="530" y="42" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#5fc9b5">States</text>
  <text x="530" y="64" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Green, yellow or red.</text>
  <text x="530" y="81" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Always exactly one.</text>
  <rect x="512" y="108" width="240" height="84" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <rect x="512" y="108" width="5" height="84" fill="#b4a7f5"/>
  <text x="530" y="134" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#b4a7f5">Moves</text>
  <text x="530" y="156" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Something happens:</text>
  <text x="530" y="173" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">the timer runs out.</text>
  <rect x="512" y="200" width="240" height="84" rx="8" fill="#1e1e1e" stroke="#2a2a28" stroke-width="1.5"/>
  <rect x="512" y="200" width="5" height="84" fill="#f2c94c"/>
  <text x="530" y="226" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;font-weight:600;fill:#f2c94c">Rules</text>
  <text x="530" y="248" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">Which moves each state</text>
  <text x="530" y="265" style="font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:13px;font-weight:400;fill:#a09d96">allows, and where to.</text>
</svg>
