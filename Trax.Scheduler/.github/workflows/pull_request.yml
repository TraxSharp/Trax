name: Pull Request

on:
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trax
          POSTGRES_PASSWORD: trax123
          POSTGRES_DB: trax_scheduler_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trax"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build --configuration Release
      - name: Create per-fixture test databases
        env:
          PGPASSWORD: trax123
        run: |
          for db in trax_scheduler_default_submitter trax_scheduler_builder_validation trax_scheduler_builder_settings; do
            psql -h localhost -U trax -d trax_scheduler_tests -c "CREATE DATABASE $db;"
          done
      - run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./TestResults
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
