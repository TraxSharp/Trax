name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default to no permissions; each job widens only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install (locked, no install scripts)
        # Nothing the site builds with needs an install script: sharp and the Next.js
        # compiler ship prebuilt binaries as optional packages. If one ever does, run
        # `npm rebuild <package>` for it here rather than dropping --ignore-scripts.
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        # scripts/sync-docs.sh clones Trax.Docs main into .docs-cache first; see the
        # script for why that clone is not pinned.
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # The operations dashboard (dashboard/) is its own npm project with its own lockfile. The site's
  # build above builds its demo; this job runs its lint, its tests (every story, and the demo's strict
  # check that every page is answered by a recording) and both its production builds.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install (locked, no install scripts)
        # esbuild and rolldown ship their binaries as platform optional packages, so nothing
        # here needs an install script.
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        # Also checks the bundle carries none of the mock or the demo.
        run: npm run build
      - name: Build the demo
        # Also checks the demo carries its recordings and not the auto-mock schema.
        run: npm run build:demo
      - name: Build Storybook
        run: npm run build-storybook
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
