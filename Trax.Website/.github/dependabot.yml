version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    # A release gets a week on npm before a bot proposes it, so a hijacked
    # version is usually caught and pulled first. Security updates are not
    # delayed by this.
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups:
      # Group only minor + patch; major bumps get their own reviewable PRs.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
