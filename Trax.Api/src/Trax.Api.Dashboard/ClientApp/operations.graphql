"""
Payload for the onDataChanged subscription. Carries only which domain changed, not the
changed rows: a subscriber uses it as a nudge to refetch its (bounded, paged) view. Signals are
coalesced server-side, so one event stands in for a whole burst of writes to that domain.
"""
type DataChangedEvent {
  domain: ChangeDomain!
  timestamp: DateTime!
}

"""
Identifies which slice of scheduler/admin data changed. Carried by
ITraxChangeSignal so a subscriber can refetch just the affected
view instead of polling. The signal names the domain only, never row data.
"""
enum ChangeDomain {
  """The work queue (entries queued, dispatched, or cancelled)."""
  WORK_QUEUE

  """
  Dead letters (created when retries are exhausted, or requeued/acknowledged).
  """
  DEAD_LETTER

  """Manifest scheduling/retry settings (edited, enabled, or disabled)."""
  MANIFEST

  """Manifest group configuration."""
  MANIFEST_GROUP

  """Scheduler configuration."""
  SCHEDULER_CONFIG

  """Train runs (metadata rows), for example runs an operator cancelled."""
  EXECUTION
}

"""The filter arguments of operations.manifests, without its paging."""
type BulkManifestFilter {
  """Only enabled (true) or disabled (false) manifests."""
