  """Runs that started in the last hour and completed or failed."""
  finishedLastHour: Long!

  """The last hour's failure rate, 0 to 1."""
  lastHourFailureRate: Float!

  """
  The failure rate of runs that started in the seven days before the last hour, 0 to 1; 0 when
