"""
What CancellationToken) did, or why it did nothing.
The first three are successes; the rest are refusals and change nothing.
"""
enum MachineInstanceCancelOutcome {
  """
  The live run was still queued and is cancelled before it started, and this call moved the
  instance through its OnCancelled edge.
  """
  MOVED

  """
  The live run was still queued and is cancelled before it started. The instance moves
  through its OnCancelled edge when a host that registers the machine applies the
  outcome (this host does not, or another delivery got there first).
  """
  RUN_CANCELLED

  """
  The live run was already dispatched, and its cancel is requested: it stops at its next
  junction, ends Cancelled, and the instance then moves through its OnCancelled edge.
  """
  CANCEL_REQUESTED

  """
  The instance is owned by a user; operators may cancel only system-owned instances.
  """
  USER_OWNED

  """No system-owned instance has this machine and id."""
  NOT_FOUND

  """
  The instance's state waits on no train run, so there is nothing to cancel.
  """
  NO_LIVE_RUN

  """
  The live run has already ended; its outcome is being applied, and a cancel cannot change it.
  """
  RUN_ENDED
}

