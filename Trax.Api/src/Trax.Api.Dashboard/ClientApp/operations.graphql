  Whether a retry of the manifest's failed run (an automatic retry, or a requeue of its dead
  letter) replays the decisions that run recorded rather than asking the decider again.
  Set at scheduling with ScheduleOptions.ReplayDecisionsOnRetry, and afterwards with the
  setManifestsReplayDecisionsOnRetry mutation (or the dashboard's matching action).
  """
  replayDecisionsOnRetry: Boolean!

  """
  The next times the scheduler will run this manifest, earliest first, in UTC, read from the manifest manager's own due-ness check: exclusion windows and the misfire policy apply, and each run is assumed to succeed when it is due. The first is now when the manifest is due already. Empty for a manual, on-demand, dependent or dormant dependent manifest (scheduleText says what starts it), and for one that is disabled, in a disabled group, or has a dead letter awaiting intervention.
  """
  nextRuns(
    """How many times to list, clamped to 0 through 10."""
    count: Int! = 5
  ): [DateTime!]!

  """
  The schedule in plain words: "Daily at 02:00 UTC", "Every 5 minutes", "After nightly-import succeeds", "On demand". A cron expression with no plain reading is shown as itself, in UTC.
  """
  scheduleText: String!
}

