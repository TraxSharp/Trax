ids than the caller confirmed, matched is the number it matches now, to confirm
and start again. While another bulk operation runs on this node, operation is
that one.
"""
type StartBulkOperationResponse {
  """Whether an operation was started."""
  success: Boolean!

  """What happened, for an operator."""
  message: String!

  """How many ids the filter matched, or null when it was not read."""
  matched: Int

