}

"""What a bulk operation does to each id it matched."""
enum BulkOperationKind {
  """Requests cancellation of each run, as cancelExecutions does."""
  CANCEL

  """Requeues each dead letter, as requeueDeadLetters does."""
  REQUEUE

  """
  Acknowledges each dead letter with the operation's note, as acknowledgeDeadLetters does.
  """
  ACKNOWLEDGE

  """Triggers each manifest, as triggerManifests does."""
  TRIGGER

  """Enables each manifest, as setManifestsEnabled(enabled: true) does."""
  ENABLE

  """Disables each manifest, as setManifestsEnabled(enabled: false) does."""
  DISABLE
}

"""
What a bulk operation applies to: exactly one of its three lists, filtered the way that list's
read filters it. startBulkOperation refuses a filter that gives none or more than one,
and one the operation's kind does not apply to: CANCEL takes executions,
REQUEUE and ACKNOWLEDGE take deadLetters, and TRIGGER,
ENABLE and DISABLE take manifests. A bulk operation reads it back
as it was given.
"""
input BulkOperationFilterInput {
  """Runs, filtered as operations.executions filters them."""
  executions: BulkExecutionFilterInput

  """
  Dead letters, filtered as operations.deadLetters.deadLetters filters them.
