  """Only manifests with this schedule type."""
  scheduleType: ScheduleType

  """Only manifests whose train name contains this text."""
  nameContains: String

  """Only manifests in this group."""
  manifestGroupId: Long

  """Leave out the scheduler's own internal trains' manifests."""
  hideAdminTrains: Boolean
}

"""
The filter arguments of operations.deadLetters.deadLetters, without its paging.
"""
