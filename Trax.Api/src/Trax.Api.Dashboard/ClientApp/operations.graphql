"""
Root query type. Empty by default. Sub-namespaces are added dynamically:

  operations — added by TraxGraphQLBuilder.ExposeOperationQueries().
  discover — added by  when trains
    annotated with [TraxQuery] or query-model registrations are present.
"""
type RootQuery {
  operations: OperationsQueries

  """
  Persisted-operation management: the stored documents and their history. Behind the management gate the host declared.
  """
  persistedOperations: PersistedOperationQueries
}

"""
Root mutation type. Empty by default. Sub-namespaces are added dynamically:

  operations — added by TraxGraphQLBuilder.ExposeOperationMutations().
  dispatch — added by  when trains
    annotated with [TraxMutation] are registered.
"""
type RootMutation {
  operations: OperationsMutations

  """
  Persisted-operation management: upload, deactivate and restore stored documents. Behind the management gate the host declared.
  """
  persistedOperations: PersistedOperationMutations
}

"""
GraphQL subscription root for real-time push. Carries per-train lifecycle events plus a
coalesced onDataChanged signal that admin UIs use to refetch a domain's view without
polling. Clients connect via WebSocket at the GraphQL endpoint.
"""
type LifecycleSubscriptions {
  """
  Fires when a train you may see starts running. Pass externalId to receive only
  the run with that external id, such as the one a queue mutation returned.
  """
  onTrainStarted(
    """
    Only the run with this external id (matched exactly); every run when omitted.
    """
    externalId: String
  ): TrainLifecycleEvent!

  """
  Fires when a train you may see completes successfully. Pass externalId to receive only
  the run with that external id, such as the one a queue mutation returned.
  """
  onTrainCompleted(
    """
    Only the run with this external id (matched exactly); every run when omitted.
    """
    externalId: String
  ): TrainLifecycleEvent!

  """
  Fires when a train you may see fails. Pass externalId to receive only
  the run with that external id, such as the one a queue mutation returned.
  """
  onTrainFailed(
    """
    Only the run with this external id (matched exactly); every run when omitted.
    """
    externalId: String
  ): TrainLifecycleEvent!

  """
  Fires when a train you may see is cancelled. Pass externalId to receive only
  the run with that external id, such as the one a queue mutation returned.
  """
  onTrainCancelled(
    """
    Only the run with this external id (matched exactly); every run when omitted.
    """
    externalId: String
  ): TrainLifecycleEvent!

  """
  Fires on every state change of a train you may see, including the start, completion, failure
  and cancellation that the other lifecycle subscriptions report individually. Pass
  externalId to follow one run, such as the one a queue mutation returned.
  """
  onTrainStateChanged(
    """
    Only the run with this external id (matched exactly); every run when omitted.
    """
    externalId: String
  ): TrainLifecycleEvent!

  """
  Fires for each step of the run metadataId: a junction starting, completing,
  failing or being cancelled, a question a routing step asked, and the track it took. Only a
  host that called AddJunctionEvents() publishes them, and you receive them exactly when
  you would receive that run's train events. In the operations view, read
  operations.junctionRuns for the steps a run took before you subscribed or that a gap
  in sequence lost. A broadcast subscriber cannot read it, so it has no way to recover a
  lost step: it sees only the steps that reach it after it subscribed.
  """
  onJunctionEvent(
    """The run to follow (its execution id)."""
    metadataId: Long!
  ): JunctionEvent!

  """
  Fires when a scheduler/admin data domain changes (work queue, dead letters, manifests,
  manifest groups, scheduler config). One event per coalesced burst; the payload names the
  domain so a client can refetch just that view.
  """
  onDataChanged: DataChangedEvent!

  """
  Every state-machine instance as it is written, or every instance of one machine: its state, revision and whether it waits on a run it invoked, and once more with deleted set when it is deleted or expires. Never its context or its owner. Behind the operations gate.
  """
  onMachineInstanceChanged(
    """Only this machine's instances."""
    machine: String
  ): MachineInstanceChange!
}
