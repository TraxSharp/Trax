"""
Who made one transition of a state-machine instance. Stored in trax.snapshot_transition.actor. It names a
kind of actor, never a user: a user-owned instance's history does not say whose it is.
"""
enum SnapshotTransitionActor {
  """
  A client acting for the owner of a user's instance, host code acting as one included.
  """
  OWNER

  """Host code driving a system-owned instance (IMachineInstances)."""
  HOST

  """
  Trax moving the instance itself: a timer, a run's outcome, or a parent spawning it.
  """
  MACHINE
}

"""
What wrote one row of a state-machine instance's history. Stored in trax.snapshot_transition.kind.
"""
enum SnapshotTransitionKind {
  """
  The instance was created: a start, a save that created a draft, or a parent spawning it.
  """
  START

  """
  A command (a machine event) moved it, sent by a client or by host code, or an effect it bound ran.
  """
  COMMAND

  """
  A save wrote the snapshot without a command: a client's autosave, or host code writing through the store.
  """
  SAVE

  """A timer of its state fired."""
  TIMER

  """
  A train run it invoked ended, and its outcome was applied, or could not be and left it stranded.
  """
  OUTCOME
}

