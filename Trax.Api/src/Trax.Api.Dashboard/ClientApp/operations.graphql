"""
The filter arguments of operations.executions, without its paging and order. An
omitted field filters nothing, as it does on the list. The list's total under a failure text
filter stops at 10,000; a bulk operation counts every match.
"""
type BulkExecutionFilter {
  """Only runs in this state."""
  trainState: TrainState

  """
  Only runs of this train (the train interface's full name, matched exactly).
  """
  trainName: String

  """Only runs that started at or after this time (UTC)."""
  startedAfter: DateTime

  """Only runs that started at or before this time (UTC)."""
  startedBefore: DateTime

  """Only runs scheduled by this manifest."""
  manifestId: Long

  """Only runs scheduled by a manifest in this group."""
  manifestGroupId: Long

  """Leave out the scheduler's own internal trains."""
  hideAdminTrains: Boolean

  """Only runs whose failure was classified this way."""
  failureClass: FailureClass

  """Only the run with this external id (matched exactly)."""
  externalId: String

  """Only runs started from inside this run."""
  parentId: Long

  """Only runs run on the machine with this name (matched exactly)."""
  hostName: String

  """Only runs whose failure reason contains this text, ignoring case."""
  failureReasonContains: String

  """
  Only runs that failed in the junction with this name (matched exactly).
  """
  failureJunction: String
}

"""How a setting is edited."""
enum EffectFieldKind {
  """A switch: true or false."""
  BOOLEAN

  """One of EnumValues."""
  ENUM

  """
  Text read as the property's type (a number, string, date, time, duration, GUID or character).
  """
  TEXT

  """
  A type with no text form (a delegate, a collection, an object): it is set in code and
  cannot be written here.
  """
  SET_IN_CODE
}

