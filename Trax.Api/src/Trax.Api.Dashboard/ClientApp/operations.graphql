"""
One question a run asked a decider, as operations.decisions returns it: the answer the
run acted on (or refused) and the tracks routing steps took on it, with what must not be shown
left out.
"""
type DecisionRecord {
  """The decision's id; decisions are recorded in id order."""
  id: Long!

  """The run that asked."""
  metadataId: Long!

  """The question's key; null on a withheld track."""
  questionKey: String

  """Which asking of the question this was in the run, from 0."""
  occurrence: Int!

  """choice, score or yes_no; null on a withheld track."""
  kind: String

  """The question as asked, as JSON; null on a withheld track."""
  question: String

  """
  The answer the run acted on (for a refusal, the one it would not act on), as JSON; null when withheld.
  """
  answer: String

  """
  Why the run would not act on the answer; null for an answer it acted on, and when withheld.
  """
  refused: String

  """True when the run refused the answer and its step failed on it."""
  isRefused: Boolean!

  """
  Identifies the asking the answer was given to; null on a withheld track.
  """
  fingerprint: String

  """
  The model that answered, when the decider is a model; null on a withheld track.
  """
  model: String

  """
  The decider's type; null when the answer was replayed, or the track is withheld.
  """
  decider: String

  """True when the answer came from an earlier run rather than a decider."""
  replayed: Boolean!

  """What each shadow decider answered, as JSON; null when withheld."""
  shadows: String

  """
  The tracks routing steps took on the decision, as a JSON array; null when none did, or when withheld.
  """
  routes: String

  """
  The hash of the state the question was asked about; null when none was recorded, or the track is withheld.
  """
  stateHash: String

  """When the question was answered (UTC)."""
  decidedAt: DateTime!

  """True when the question is about a type marked [TraxSensitive]."""
  answerWithheld: Boolean!

  """True when the run had already taken a track on a withheld answer."""
  trackWithheld: Boolean!

  """
  Why an earlier run's answer was not replayed, so the decider was asked afresh: the
  replay_refused member of Answer. Null when the answer carries none,
  and when the answer is withheld.
  """
  replayRefused: String
}

"""
One setting of a configurable effect: what it is, how it is edited, and its current value
unless it is sensitive.
"""
type EffectSettingInfo {
  """The property's name, which operations.configureEffect takes."""
  name: String!

  """The property's type name, without Nullable<>, such as Int32."""
  typeName: String!

  """
  How the setting is edited: a switch, one of EnumValues, text, or not here at all.
  """
  kind: EffectFieldKind!

  """
  Whether the setting accepts no value; a null or blank value writes null.
  """
  nullable: Boolean!

  """The member names, for an enum; null otherwise."""
  enumValues: [String!]

  """
  True when the property is marked [TraxSensitive]: Value is always
  null. It can still be written.
  """
  sensitive: Boolean!

  """
  Whether the setting holds a value (is not null). True for a sensitive setting that holds one.
  """
  hasValue: Boolean!

  """
  The current value as text, in the form configureEffect reads back; null when there is
  none, when the setting is sensitive, and for SET_IN_CODE.
  """
  value: String

  """What to type, such as yyyy-MM-dd HH:mm:ss (UTC)."""
  hint: String!
}

"""One reason a bulk operation's ids did not take, and how many."""
type BulkOperationFailureReason {
  """The reason."""
  reason: String!

  """How many ids failed for it."""
  count: Int!
}

"""Where a bulk operation is."""
enum BulkOperationStatus {
  """Batches are still running."""
  RUNNING

  """
  Every id it matched was attempted. failed counts the ones that
  did not take, each with its reason.
  """
  FINISHED

  """
  It stopped before the end: the server refused a batch (the message says why) or failed
  (the detail is in the server's log). The ids it had not reached were not attempted.
  """
  FAILED

  """The server was shutting down, so it stopped between batches."""
  CANCELED
}

"""
What a bulk operation applies to: exactly one of its three lists, filtered the way that list's
read filters it. startBulkOperation refuses a filter that gives none or more than one,
and one the operation's kind does not apply to: CANCEL takes executions,
REQUEUE and ACKNOWLEDGE take deadLetters, and TRIGGER,
ENABLE and DISABLE take manifests. A bulk operation reads it back
as it was given.
"""
type BulkOperationFilter {
  """Runs, filtered as operations.executions filters them."""
  executions: BulkExecutionFilter

  """
  Dead letters, filtered as operations.deadLetters.deadLetters filters them.
  """
  deadLetters: BulkDeadLetterFilter

  """Manifests, filtered as operations.manifests filters them."""
  manifests: BulkManifestFilter
}

"""One id a bulk operation did not apply to, and why."""
type BulkOperationFailure {
  """The run, dead letter or manifest id."""
  id: Long!

  """Why it did not take, in the operator's words."""
  reason: String!
}

"""A host that has missed three heartbeats in a row."""
type AttentionHost {
  """The process's identity, as stamped on its runs."""
  instanceId: String!

  """The machine it ran on."""
  hostName: String!

  """When it last beat (UTC)."""
