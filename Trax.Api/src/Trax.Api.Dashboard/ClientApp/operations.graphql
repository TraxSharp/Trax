"""Represents the possible states of a train during its lifecycle."""
enum TrainState {
  """The train has been created but has not yet started execution."""
  PENDING

  """The train has successfully completed execution."""
  COMPLETED

  """
  The train encountered an error during execution and did not complete successfully.
  """
  FAILED

  """The train is currently executing."""
  IN_PROGRESS

  """The train was explicitly cancelled by an operator or system signal."""
  CANCELLED
}

"""What happened to a step of a run."""
enum JunctionEventType {
  """A junction started."""
  JUNCTION_STARTED

  """A junction returned a result."""
  JUNCTION_COMPLETED

  """A junction failed."""
  JUNCTION_FAILED

  """A junction was stopped by a cancellation the run was asked for."""
  JUNCTION_CANCELLED

  """A routing step asked a question and the run acts on the answer."""
  DECIDED

  """A decider's answer the run would not act on; the routing step fails."""
  DECISION_REFUSED

  """A routing step sent the run down a track."""
  ROUTED
}

"""
What one step of a run's timeline is: a junction that ran, a question a routing step asked, or
the track a routing step took. Carried by junction events and stored in
trax.junction_run.kind.
"""
enum JunctionRunKind {
  """An EffectJunction that ran."""
  JUNCTION

  """A question answered by choosing one of its options (Decide, Switch)."""
  CHOICE

  """A question answered by a position on ordered levels (Scale)."""
  SCORE

  """A question answered by the probability of yes (Gate)."""
  YES_NO

  """The track a routing step sent the run down."""
  ROUTE
}

"""
Where one step of a run's timeline stands. Carried by junction events and stored in
trax.junction_run.state.
"""
enum JunctionRunState {
  """The junction has started and not yet returned."""
  IN_PROGRESS

  """
  The junction returned a result, or the question was answered, or the track taken.
  """
  COMPLETED

  """
  The junction failed, or a decider's answer was refused and the routing step failed on it.
  """
  FAILED

  """The junction stopped because the run was asked to cancel."""
  CANCELLED
}

"""
What kind of failure a train hit, so a consumer can decide whether to retry, rebase, or give up
without matching on exception messages at every call site.
"""
enum FailureClass {
  """
  No classifier was registered, or it did not recognise this failure. Means "decide as you
  would have before this existed": the default, so behaviour is unchanged until something
  deliberately acts on a classification.
  """
  UNCLASSIFIED

  """
  Expected to succeed if attempted again: a throttle, a lost connection, a server timeout
  reported as an error.
  """
  TRANSIENT

  """
  Someone else changed the thing first. The work is valid but was built on a state that has
  moved, so the answer is usually to rebuild against current state and try again, not to
  compensate.
  """
  CONFLICT

  """
  Will fail the same way every time: a validation error, a missing record, a rejected
  credential. Retrying is waste.
  """
  PERMANENT
}

"""
What needs an operator's attention right now, read in one call by
CancellationToken): whether the scheduler is paused, the dead
letters awaiting intervention, the trains failing more than usual, the stuck state-machine
instances, the queue backlog and the hosts that stopped beating. Each entry carries
Link, the operations console's path and query that lists what it counts.
"""
type Attention {
  """Whether the manifest manager and the job dispatcher are switched on."""
  scheduler: AttentionScheduler!

  """
  The dead letters awaiting intervention, one group per train and reason, largest first, at most
  AttentionListCap groups.
  """
  deadLetters: [AttentionDeadLetterGroup!]!

  """
  The trains whose failure rate in the last hour is above their rate over the six days and 23
  hours before it, highest rate first, at most AttentionListCap.
  """
  failingTrains: [AttentionFailingTrain!]!

  """
  The stuck state-machine instances, one group per machine and state, largest first, at most
  AttentionListCap groups.
  """
  stuckInstances: [AttentionStuckInstances!]!

  """How much queued work is waiting and how long the oldest has waited."""
  queue: AttentionQueue!

  """
  The hosts that beat in the last day and have since missed three beats, most recently seen
  first, at most AttentionListCap.
  """
  offlineHosts: [AttentionHost!]!

  """When the read was made (UTC); ages and rates are measured from it."""
  asOf: DateTime!
}

"""
One action applied to every id a filter matched, run in the background in batches on the node
that started it. startBulkOperation returns one at once, and
operations.bulkOperation(id) reads it again until status is no longer
RUNNING.
"""
type BulkOperation {
  """
  The ids that did not take, in id order, each with its reason. Pass the last id of a page as
  afterId for the next. The first
  10,000 failures are kept; past that they
  are counted in failed and failureReasons only.
  """
  failures(
    """The page size, clamped to 1 through 500."""
    take: Int! = 100

    """Only failures with a larger id (the previous page's last id)."""
    afterId: Long
  ): [BulkOperationFailure!]!

  """Identifies the operation to bulkOperation on the node that started it."""
  id: UUID!

  """What it does to each id."""
  kind: BulkOperationKind!

  """The filter it was started with, as it was given."""
  filter: BulkOperationFilter!

  """
  Who started it: the caller's principal id ({scheme}:{id}), else the name the
  caller signed in with, else <anonymous>.
  """
  actor: String!

  """
  true when every run it requeues or triggers asks its deciders afresh rather than
  replaying recorded decisions.
  """
  askAfresh: Boolean!

  """When it started (UTC)."""
  startedAt: DateTime!

  """When it stopped (UTC), or null while running."""
  finishedAt: DateTime

  """Where it is."""
  status: BulkOperationStatus!

  """
  How many ids the filter matched when it started, every one it will attempt.
  """
  total: Int!

  """
  How many ids are in the state the operation asks for once their batch ran: cancellation
  requested, requeued, acknowledged, triggered, enabled or disabled.
  """
  done: Int!

  """How many ids their batch ran on and did not take; each has a reason."""
  failed: Int!

  """A human-readable description of where it is or how it ended."""
  message: String!

  """Every failure, grouped by its reason, the most common first."""
  failureReasons: [BulkOperationFailureReason!]!
}

