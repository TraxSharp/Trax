schema {
  query: RootQuery
  mutation: RootMutation
  subscription: LifecycleSubscriptions
}

"""
The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response.
"""
directive @cost(
  """
  The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc.
  """
  weight: String!
) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION

"""
Event payload published by lifecycle hooks and consumed by GraphQL subscriptions.
"""
type TrainLifecycleEvent {
  metadataId: Long!
  externalId: String!
  trainName: String!
  trainState: TrainState!
  timestamp: DateTime!
  failureJunction: String
  failureReason: String
  hostName: String
  hostEnvironment: String

  """
  This event's position in the subscription: 1 for the first event and one more for each after it. A jump of more than one means events were lost on the way to this subscriber; refetch what you show. The live feed is lossy under load.
  """
  sequence: Long!
  output: Any
}

"""
What happened to one step of a run: the payload of the onJunctionEvent subscription.
"""
type JunctionEvent {
  """The run's execution id."""
  metadataId: Long!

  """The run's stable external id."""
  externalId: String!

  """The train's canonical name (its interface's full name)."""
  trainName: String!

  """What happened to the step."""
  eventType: JunctionEventType!

  """When the event was published (UTC)."""
  timestamp: DateTime!

  """The step."""
  junction: JunctionStep!

  """
  This event's position in the subscription: 1 for the first event and one more for each after it. A jump of more than one means events were lost on the way to this subscriber. The feed is shared by every run on the host, so a gap can come from another run's steps rather than this one's. In the operations view read operations.junctionRuns again to recover; a broadcast subscriber cannot read it, and has no way to recover a gap. The live feed is lossy under load.
  """
  sequence: Long!
}

"""
One step of a run: a junction that ran, a question a routing step asked, or the track it took.
The onJunctionEvent subscription carries one per event, and
operations.junctionRuns returns a run's steps as AddJunctionEvents() recorded them.
"""
type JunctionStep {
  """
  Where the step falls in the run, from 0. A junction's start and end share it.
  """
  position: Int!

  """What the step is."""
  kind: JunctionRunKind!

  """The junction's class name without its namespace, or a question's key."""
  name: String!

  """Where the step stands."""
  state: JunctionRunState!

  """
  When the junction started, or when the question was answered or the track taken (UTC).
  """
  startedAt: DateTime!

  """When the junction returned (UTC), or null while it runs."""
  endedAt: DateTime

  """Milliseconds from StartedAt to EndedAt, or null while it runs."""
  durationMs: Float

  """How a failed junction's failure is classified; null unless it failed."""
  failureClass: FailureClass

  """
  The type name of the exception a junction failed or was cancelled with, never its message.
  """
  failureException: String

  """The question's key, for a question or a track."""
  questionKey: String

  """
  The answer the run acted on, or null for a junction, a refused answer and a withheld one.
  """
  answer: String

  """How sure the decider was, for a choice or a score; null when withheld."""
  confidence: Float

  """True when the answer came from an earlier run rather than a decider."""
  replayed: Boolean!

  """
  The full name of the decider's type. Live events only; the recorded timeline does not keep it.
  """
  decider: String

  """
  True when the question is about a [TraxSensitive] type, so its answer and confidence are absent.
  """
  answerWithheld: Boolean!

  """
  Which attempt of its manifest the run is, or null for a run with no manifest.
  """
  attempt: Int

  """
  True when Name is (withheld): the step is on a decision track, and its
  name would give away an answer this caller is not shown.
  """
  nameWithheld: Boolean!

  """
  The position of the latest routing step before this one, or null before any. Every step
  after a route, a junction, a question or a further route, counts as on its track.
  """
  trackPosition: Int

  """
  The id of the declared node this step ran for, as operations.runGraph names it. Null for a step recorded before node ids were, and wherever the step's name is withheld, since the id names the track.
  """
  nodeId: String

  """
  The path of the Parallel branch the step ran in, such as Parallel#0/cocitation, or null outside any branch. Withheld wherever the step's name is.
  """
  branchPath: String
}

"""
Predefined operational queries: health, trains, manifests, manifest groups, execution
history, and the nested deadLetters namespace.
"""
type OperationsQueries {
  """
  What needs an operator's attention: whether the manifest manager and the job dispatcher are
  switched on (scheduler), the dead letters awaiting intervention grouped by train and
  reason (deadLetters), the trains whose failure rate in the last hour is above their
  rate over the week before it (failingTrains), the stuck state-machine instances by
  machine and state (stuckInstances), the queued work that is due and how long the
  oldest has waited (queue), and the hosts that have missed three heartbeats
  (offlineHosts). Each entry's link is the console path and query that lists
  it. Read through CancellationToken).
  """
  attention: Attention!

  """
  Every bulk operation this node knows, newest first: the one running, and those that
  finished in the last 24 hours (at most 100). An operation started on another node, or
  before this node restarted, is not listed.
  """
  bulkOperations: [BulkOperation!]!

  """
  One bulk operation by id, or null when this node does not know it: it was started on
  another node, this node has restarted since, or it finished more than 24 hours ago.
  """
  bulkOperation(
    """The operation's id, as startBulkOperation returned it."""
    id: UUID!
  ): BulkOperation

  """
  Nested namespace exposing dead letter queries (deadLetters, deadLetter).
  """
  deadLetters: DeadLetterQueries!

  """Nested namespace exposing work queue queries (workQueues, workQueue)."""
  workQueue: WorkQueueQueries!

  """Nested namespace exposing manifest group queries (graph)."""
  manifestGroups: ManifestGroupQueries!

  """
  Nested namespace exposing log queries (paginated reads of the log records trains write).
  """
  logs: LogQueries!

  """
  Nested namespace exposing dashboard / server metrics. Same data the dashboard
  Index page renders.
  """
  metrics: MetricsQueries!

  """
  Nested namespace exposing live scheduler runtime config (what the dashboard's
  ServerSettingsPage reads).
  """
  config: ConfigQueries!

  """
  The current health summary: queue depth, running and recently failed executions, and dead
  letters awaiting intervention. Computed on every call.
  """
  health: HealthStatus!

  """
  Canonical FullNames of the internal/administrative scheduler trains (JobDispatcher,
  ManifestManager, JobRunner, cleanup, etc.). Clients filter these out of live subscription
  feeds; the executions query filters them server-side via hideAdminTrains.
  """
  adminTrainNames: [String!]!

  """
  Every train registered with this host, with its input schema, authorization requirements and
  how it is exposed in GraphQL.
  """
  trains(
    """Leave out the scheduler's own internal trains (see adminTrainNames)."""
    hideAdminTrains: Boolean! = false
  ): [TrainInfo!]!

  """
  The observational effects registered in THIS process, with their enabled + toggleable state
  and, for a factory that exposes runtime settings, those settings: as JSON, and as
  fields an editor can be built from. Read through
  IEffectSettingsService, the call the dashboard's effects page makes. The
  registry and each settings object are in-memory per-process singletons, so this reflects the
  API host only, not the scheduler/worker processes where effects run;
  operations.setEffectEnabled and operations.configureEffect change them here.
  Empty when the host registers no effect registry.
  """
  effects: [EffectInfo!]!

  """
  One run's recorded decisions, in the order it made them: each question it asked a decider,
  the answer it acted on (or refused), and the tracks routing steps took on it. Read through
  CancellationToken), the read the dashboard's run
  page makes. Empty for a run that recorded none, and for an id with no run. A run's replay
  link is on executionDetail (replayDecisionsOf, replayAbandoned).
  """
  decisions(
    """The run's id."""
    metadataId: Long!

    """Only decisions recorded after this one (a page's nextCursor)."""
    afterId: Long

    """The page size, clamped to 1 through 500."""
    take: Int! = 50
  ): DecisionPage!

  """
  The schedule exclusion windows configured on a manifest (the days/dates/ranges/time windows
  during which it is intentionally skipped). Empty when the manifest has none or does not
  exist. Backs the exclusions panel on the dashboard's manifest detail page.
  """
  manifestExclusions(manifestId: Long!): [ManifestExclusion!]!

  """
  A page of manifests, newest first. Pass the previous page's nextCursor as
  afterId to page deeply; skip is ignored when afterId is set. Carries no
  train input; manifestDetail does.
  """
  manifests(
    """
    How many manifests to skip (negative is treated as 0; above 10,000 is refused with TRAX_SKIP_TOO_DEEP, so page deeper with afterId).
    """
    skip: Int! = 0

    """The page size, clamped to 1 through 500."""
    take: Int! = 25

    """Only enabled (true) or disabled (false) manifests."""
    isEnabled: Boolean

    """Only manifests with this schedule type."""
    scheduleType: ScheduleType

    """Only manifests whose train name contains this text."""
    nameContains: String

    """Only manifests older than this id (a keyset cursor)."""
    afterId: Long

    """Only manifests in this group."""
    manifestGroupId: Long

    """
    Leave out the scheduler's own internal trains' manifests (see adminTrainNames).
    """
    hideAdminTrains: Boolean! = false
  ): PagedResultOfManifestSummary!

  """
  Full detail for one manifest, including the train input it runs with. The input is on this
  single-row read only, never on the manifests list, the way an execution's input is on
  executionDetail alone. The manifest keeps it unmasked because its runs start from it;
  here each [TraxSensitive] member reads {"_redacted": true}, and an input this
  host cannot read as its type is masked whole. Returns null when the manifest does
  not exist.
  """
  manifestDetail(id: Long!): ManifestDetail

  """
  Execution roll-up for a single manifest: run counts by state plus the most recent run and
  most recent successful run. Backs the summary cards on the dashboard's manifest detail page,
  and reads through the same IOperationsService call. A manifest with no runs,
  or an id with no manifest, gets zeros and nulls.
  """
  manifestStats(manifestId: Long!): ManifestExecutionStats!

  """
  Execution roll-up for one train, keyed by its interface FullName (the name every
  execution records). Backs the per-train detail page.
  """
  trainStats(trainName: String!): TrainExecutionStats!

  """
  The host processes that have beaten in the last day, from trax.host_heartbeat: each
  one's identity, Trax version, start, last heartbeat, whether it is online, what it runs, and
  how many runs it has in progress. Every host with a data provider beats every 15 seconds
  whether or not it has work, and one is offline once three beats are missed (45 seconds).
  Online hosts come first, then by name.
  """
  hosts: [HostInfo!]!

  """
  A page of executions. Pass the previous page's nextCursor as afterId to page
  deeply in either order; skip is ignored when afterId is set. Unfiltered, the
  total may be an estimate (isEstimatedCount). Filtered by failure text, it counts at
  most 10,000 matches: past that it reads 10,000 with isCountCapped true, a lower bound.
  Under any other filter it is exact. Carries no input, output or stack trace;
  executionDetail does.
  """
  executions(
    """
    How many executions to skip (negative is treated as 0; above 10,000 is refused with TRAX_SKIP_TOO_DEEP, so page deeper with afterId).
    """
    skip: Int! = 0

    """The page size, clamped to 1 through 500."""
    take: Int! = 25

    """Only executions in this state."""
    trainState: TrainState

    """
    Only executions of this train (the train interface's full name, matched exactly).
    """
    trainName: String

    """Only executions that started at or after this time (UTC)."""
    startedAfter: DateTime

    """Only executions that started at or before this time (UTC)."""
    startedBefore: DateTime

    """Newest first (the default) or oldest first."""
    order: SortOrder! = NEWEST

    """A keyset cursor: the page continues after this id in the chosen order."""
    afterId: Long

    """Only executions scheduled by this manifest."""
    manifestId: Long

    """Only executions scheduled by a manifest in this group."""
    manifestGroupId: Long

    """Leave out the scheduler's own internal trains."""
    hideAdminTrains: Boolean! = false

    """Only executions whose failure was classified this way."""
    failureClass: FailureClass

    """Only the execution with this external id (matched exactly)."""
    externalId: String

    """Only executions started from inside this execution's run."""
    parentId: Long

    """Only executions run on the machine with this name (matched exactly)."""
    hostName: String

    """
    Only executions whose failure reason contains this text, ignoring case.
    """
    failureReasonContains: String

    """
    Only executions that failed in the junction with this name (matched exactly).
    """
    failureJunction: String
  ): PagedResultOfExecutionSummary!

  """
  Full detail for one execution, including its input, output, stack trace and the number of
  executions it started, what it is linked to (the state-machine instance that invoked it,
  the work queue entry it ran from, the dead letter it retries), or null when none has
  that id.
  """
  executionDetail(id: Long!): ExecutionDetail

  """
  Paginated child executions of a parent: the executions it started, newest first.
  Keyset-paginated on id like the top-level executions list.
  """
  executionChildren(parentId: Long!, take: Int! = 25, afterId: Long): PagedResultOfExecutionSummary!

  """
  The steps of one execution, in the order it reached them, as AddJunctionEvents()
  recorded them: each junction that ran, each question a routing step asked and the track it
  took. Empty for an execution with none recorded, and for an id with no execution.
  """
  junctionRuns(
    """The execution's id."""
    metadataId: Long!

    """Only steps after this position (a keyset cursor for the next page)."""
    afterPosition: Int

    """The page size, clamped to 1 through 500."""
    take: Int! = 500
  ): [JunctionStep!]!

  """
  One execution drawn on its train's declared chain: each node with the steps the run
  recorded for it and where it stands (completed, failed, skipped on a track not taken, not
  reached), the track each routing step took, and the steps that match no node. Null for an
  id with no execution.
  """
  runGraph(
    """The execution's id."""
    metadataId: Long!
  ): RunGraph

  """
  What an id, key or name names, when the caller does not know its kind: runs (id, external
  id), manifests (id, external id, name), work queue entries (id, external id, subject key),
  dead letters (id), state-machine instances (their GUID) and registered trains (full or
  friendly name). Each match says its kind and id, which page it opens, a
  label, and the field it matched on. Read through
  CancellationToken), the call the console's search makes.
  """
  lookup(
    """The id, key or name to look up."""
    text: String!
  ): [LookupMatch!]!

  """
  A page of state-machine instances, system-owned and user-owned alike, newest first by when
  each was last written. Each carries its machine, owner kind, id, state, version,
  timestamps and whether it waits on a train run it invoked; never its context or its
  owner's key. Page with skip and take; there is no cursor, because the order
  is by a time that moves. The total counts at most 10,000 instances: past that it reads
  10,000 with isCountCapped true, and machineInstanceCounts has the exact
  numbers by state.
  """
  machineInstances(
    """Only instances of this machine (its id, matched exactly)."""
    machine: String

    """Only instances in this state (matched exactly)."""
    state: String

    """Only instances a user owns, or only those the system owns."""
    ownerKind: SnapshotOwnerKind

    """
    How many instances to skip (negative is treated as 0; above 10,000 is refused with TRAX_SKIP_TOO_DEEP).
    """
    skip: Int! = 0

    """The page size, clamped to 1 through 500."""
    take: Int! = 25

    """
    True for only the stuck instances (a timer overdue, or waiting on a run that failed or was
    cancelled), false for only the others; omitted, both.
    """
    stuck: Boolean
  ): PagedResultOfMachineInstance!

  """
  One state-machine instance with the train runs it invoked (invokedRuns, newest
  first, at most 50, the one its state waits on marked isLive; a user's draft lists
  only its live run), or null when none matches. The owner kind is always named,
  because a user can hold a draft under the same id as a system instance. A system instance
  is unique by machine and id; a user's draft is named by its rowId too (refused with
  TRAX_ROW_ID_REQUIRED without one), because several users can each hold a draft
  under one id and an operator is not shown whose a draft is.
  """
  machineInstance(
    """The machine's id."""
    machine: String!

    """Who owns the instance."""
    ownerKind: SnapshotOwnerKind!

    """The instance or draft id."""
    id: UUID!

    """The row's key, from the list; required for a user's draft."""
    rowId: Long
  ): MachineInstanceDetail

  """
  How many instances each machine has in each state, for each owner kind, ordered by machine,
  state and owner kind, and how many of them are stuck. Exact. Read through the call the dashboard's State machines page
  makes for its counts, which each host keeps for 5 seconds per machine filter, so every
  caller polling them shares one read and a count can be that old.
  """
  machineInstanceCounts(
    """Only this machine's counts; omitted, every machine's."""
    machine: String
  ): [MachineInstanceCount!]!

  """
  Every state machine the host registers, ordered by name, whether or not it has any
  instances: its version and its graph, read from its IR by the same reading
  trax machine show draws it from. Each state says whether it is initial, final or
  committed, and which train it invokes or machine it spawns; each transition says what takes
  it (COMMAND, TIMER or OUTCOME) and its guard; each timer how long its
  state is held. A machine declared with C# delegates has no IR, and is listed with
  graphUnavailableReason instead of a graph.
  """
  machines: [MachineDefinition!]!
}

"""
Queries for dead letter records with optional status filtering and pagination.
"""
type DeadLetterQueries {
  """
  A page of dead letters, newest first. Pass the previous page's nextCursor as
  afterId to page deeply; skip is ignored when afterId is set.
  """
  deadLetters(
    """
    How many dead letters to skip (negative is treated as 0; above 10,000 is refused with TRAX_SKIP_TOO_DEEP, so page deeper with afterId).
    """
    skip: Int! = 0

    """The page size, clamped to 1 through 500."""
    take: Int! = 25

    """Only dead letters in this status; null for all."""
    status: DeadLetterStatus

    """Only dead letters older than this id (a keyset cursor)."""
    afterId: Long

    """Only dead letters of this manifest."""
    manifestId: Long
  ): PagedResultOfDeadLetterSummary!

  """
  A requeue-all job requeueAllDeadLetters started on this node, or null when this
  node does not know the id: it was started on another node, this node has restarted since,
  or it finished more than 24 hours ago. A job is read on the node that started it; the
  backlog itself is deadLetters(status: AWAITING_INTERVENTION).totalCount on any node.
  """
  requeueAllJob(id: UUID!): DeadLetterRequeueJob

  """One dead letter by id, or null when none has that id."""
  deadLetter(id: Long!): DeadLetterSummary
}

"""
Queries for the work queue: pending, dispatched, and cancelled entries with optional
status / train name filtering and keyset pagination.
"""
type WorkQueueQueries {
  """
  A page of work queue entries, newest first. Pass the previous page's nextCursor as
  afterId to page deeply; skip is ignored when afterId is set. Carries no
  train input; detail does.
  """
  workQueues(
    """
    How many entries to skip (negative is treated as 0; above 10,000 is refused with TRAX_SKIP_TOO_DEEP, so page deeper with afterId).
    """
    skip: Int! = 0

    """The page size, clamped to 1 through 500."""
    take: Int! = 25

    """Only entries in this status."""
    status: WorkQueueStatus

    """Only entries for this train (matched exactly)."""
    trainName: String

    """Only entries older than this id (a keyset cursor)."""
    afterId: Long

    """Only entries that serialize on this subject (matched exactly)."""
    subjectKey: String

    """Only entries queued for this manifest."""
    manifestId: Long
  ): PagedResultOfWorkQueueSummary!

  """
  Full detail for one work queue entry: its train input, and for a queued entry with a
  subject, what it is waiting on. The input is on this single-row read only, never on the
  workQueues list, the way an execution's input is on executionDetail alone.
  The entry keeps the input unmasked because the run starts from it; here each
  [TraxSensitive] member reads {"_redacted": true}, as in an execution's
  recorded input, and an input this host cannot read as its type is masked whole.
  Returns null when the entry does not exist.
  """
  detail(id: Long!): WorkQueueDetail
}

"""
Queries under operations.manifestGroups. Holds the paginated list of manifest
groups, single-group lookup, and the 1-hop cross-group dependency neighborhood used
by the dashboard's DAG visualisation. graph goes through the same service the
dashboard uses, so both see identical nodes and edges.
"""
type ManifestGroupQueries {
  """
  Paginated list of manifest groups, newest first. Lives here (not on
  OperationsQueries) because the parent's manifestGroups field
  returns this namespace; a sibling field with the same camelCased name would
  collide and HotChocolate would silently drop one.
  """
  groups(skip: Int! = 0, take: Int! = 25, nameContains: String, afterId: Long): PagedResultOfManifestGroupSummary!

  """
  Single-group lookup by id. Returns null when the group does not exist.
  Required by the dashboard's group detail page so it can pre-populate the
  maxActiveJobs, priority, and isEnabled form before the
  operator submits a patch.
  """
  group(id: Long!): ManifestGroupSummary

  """
  Execution roll-up for a set of manifest groups: manifest count, executions by state, and
  last run per group. Batched so the dashboard's groups list fetches stats for just the
  visible page in one round-trip, through the same IOperationsService call.
  Every requested id gets a row (zeros when it has no manifests or executions), once, in the
  order requested, so the caller can zip it to its rows. More than 1000 distinct ids fails
  the field with TRAX_TOO_MANY_IDS.
  """
  stats(groupIds: [Long!]!): [ManifestGroupStats!]!

  """
  Returns the dependency graph for the given group, or null if the group
  does not exist. Empty groups still return a single-node graph (the focal group)
  so the UI can render it.
  """
  graph(groupId: Long!): ManifestGroupDependencyGraph

  """
  The whole cross-group dependency graph: every group as a node and every cross-group
  dependency as a directed parent → dependent edge. Nothing is highlighted. Backs the
  dashboard's global dependency graph on the manifest-groups page.
  """
  dependencyGraph: ManifestGroupDependencyGraph!
}

"""
Queries over the log records trains write, for the dashboard's Logs page and ad-hoc API consumers.
Reads only; logs are written by the framework. The page and the filtered count come from
IOperationsService, which the dashboard reads too, so both apply one filter.
"""
type LogQueries {
  """
  A page of log records written by trains, newest first unless order says otherwise.
  Pass the previous page's nextCursor as afterId to page deeply in either order;
  skip is ignored when afterId is set. Unfiltered, the total may be an estimate
  (isEstimatedCount). Filtered by text, it counts at most 10,000 matches: past that it
  reads 10,000 with isCountCapped true, a lower bound. Under any other filter it is
  exact.
  """
  logs(
    """
    How many records to skip (negative is treated as 0; above 10,000 is refused with TRAX_SKIP_TOO_DEEP, so page deeper with afterId).
    """
    skip: Int! = 0

    """The page size, clamped to 1 through 500."""
    take: Int! = 25

    """Only records written by this execution."""
    metadataId: Long

    """Only records at this level or above."""
    minimumLevel: LogLevel

    """Only records with exactly this logger category."""
    category: String

    """A keyset cursor: the page continues after this id in the chosen order."""
    afterId: Long

    """Only records whose message contains this text, ignoring case."""
    messageContains: String

    """Only records whose logger category contains this text, ignoring case."""
    categoryContains: String

    """Newest first (the default) or oldest first, as a run's log reads."""
    order: SortOrder! = NEWEST
  ): PagedResultOfLogEntry!
}

"""
Queries under operations.metrics. Backed entirely by
IOperationsService so the dashboard's KPI cards / charts and the
GraphQL API see identical numbers.
"""
type MetricsQueries {
  """
  The dashboard's headline counts, the executions-over-time chart for range, and the
  seven-day top failures, slowest trains and throughput series: the same numbers the
  dashboard's overview shows.
  """
  dashboard(
    """The window and bucket size of the time series."""
    range: MetricsRange! = LAST24_HOURS

    """Leave the scheduler's own internal trains out of the counts."""
    hideAdminTrains: Boolean! = false
  ): DashboardMetrics!

  """
  Runs over time for one train, manifest or group: for each bucket of range, how many
  runs that started in it completed, failed or were cancelled, and the median and 95th
  percentile duration of the completed ones. Every bucket is returned, oldest first.
  """
  series(
    """What the runs are of."""
    scope: MetricSeriesScope!

    """
    The window: the last hour in minutes, 24 hours in quarter hours, or 7 days in hours. LAST30_DAYS is refused with TRAX_METRICS_SERIES_ARGUMENT: the existing indexes cannot serve it inside the metrics budget.
    """
    range: MetricSeriesRange!

    """The manifest's or group's id, for a MANIFEST or GROUP scope."""
    id: Long

    """The train's interface FullName, for a TRAIN scope."""
    name: String
  ): MetricSeries!

  """
  Runtime metrics of this API process: start time, uptime, working set and managed heap
  size, read when called. CPU is on serverCpuPercent.
  """
  server: ServerMetrics!

  """
  This API process's CPU utilisation since the previous poll (0-100, normalised by core
  count). Separate from IOperationsService) because it is stateful per process: it needs
  a delta between two samples, so the first poll returns null while the baseline primes.
  """
  serverCpuPercent: Float
}

"""
Queries under operations.config. Returns the live scheduler runtime settings;
matches what the dashboard's ServerSettingsPage reads, since both go through
IOperationsService.
"""
type ConfigQueries {
  """
  The scheduler's current runtime settings, as this process holds them in memory (including
  any change made with updateScheduler).
  """
  scheduler: SchedulerConfigSnapshot!

  """
  The API host's environment name (IHostEnvironment.EnvironmentName), which the
  dashboard shows as its environment badge.
  """
  environmentName: String!

  """
  The version of Trax serving this API, such as 1.46.0: the Trax.Api.GraphQL
  package's version without its build metadata. It is what the operations console's footer
  shows, and it says which Trax release the host runs, not the host application's own
  version.
  """
  version: String!

  """
  The level each category configured under the API host's Logging:LogLevel section
  filters at now, Default first and the rest by name, including any change made with
  setLogLevels. Read through ILogLevelService, the call the dashboard's
  server settings make. Only that section is read; nothing else in configuration is reachable
  from here. Empty when the host configures none.
  """
  logLevels: [LogLevelSetting!]!
}

"""
One run drawn on its train's declared chain: every node the train declares, each with the steps
the run recorded for it and where it stands, and the steps that match no node. Read through
RunGraphs, which operations.runGraph and the dashboard's run page both call.
"""
type RunGraph {
  """The run's id."""
  metadataId: Long!

  """The run's train, by its canonical name."""
  train: String!

  """
  False when the host has no graph for the train (not registered here, or its chain cannot be read outside a request): nodes is empty and every step is unmatched.
  """
  hasGraph: Boolean!

  """The graph's Hash, or null without a graph."""
  hash: String

  """
  True when the run recorded its chain's hash when it started and it differs from hash: the chain has changed since the run, and the nodes it is drawn on may not be the ones it ran. False when the run recorded none or there is no graph.
  """
  chainChanged: Boolean!

  """The declared nodes, in the order the chain declares them."""
  nodes: [RunGraphNode!]!

  """
  Every node of the graph at any depth, in one list: depth first, each node before the nodes on its tracks, each track's nodes in declared order. Each says where it sits (parentId, track, depth), so a client can rebuild the tree without following nested tracks, which a query cannot follow past the server's field-cycle limit. Select only the tracks' own fields here (name, taken, ...), not their nodes.
  """
  allNodes: [RunGraphNode!]!

  """
  Steps that match no node of the current graph: recorded before node ids were, on a withheld track, or for a chain that has changed since the run.
  """
  unmatchedSteps: [JunctionStep!]!

  """
  True when the run recorded more steps than one read matches (500), so a later node can show as not reached when it ran.
  """
  moreSteps: Boolean!

  """
  True when resumeExecution without from can resume the run after its latest checkpoint: it failed or was cancelled, no state machine's step started it, and the resume check over the declared chain allows it. The mutation can still refuse the run for its saved input or a resume already queued.
  """
  canResume: Boolean!
}

"""
A train available in the system, including its input schema for API consumers.
"""
type TrainInfo {
  """
  The train's declared chain, drawn the way runGraph draws a run of it, with no run: the same nodes in the same order, every one NOT_REACHED, no steps, and metadataId 0. hasGraph is false when this host cannot read the train's chain.
  """
  chain: RunGraph!

  """
  True when the train declares a step that asks a decider and records the decision (a Decide, or a Switch, Gate or Scale that asks its own question). Only such a train's runs have decisions a requeue can replay or ask afresh. False when this host cannot read the train's chain.
  """
  asksDecisions: Boolean!
  serviceTypeName: String!
  implementationTypeName: String!
  inputTypeName: String!
  outputTypeName: String!
  lifetime: String!
  inputSchema: [InputPropertySchema!]!
  requiredPolicies: [String!]!
  requiredRoles: [String!]!
  isQuery: Boolean!
  isMutation: Boolean!
  graphQLName: String
  isBroadcastEnabled: Boolean!

  """
  The train's canonical name: its service interface's FullName, which every other
  operations field that takes a train keys on (workQueue.queueTrain,
  workQueue.runTrain, trainStats, executions(trainName:),
  workQueues(trainName:)). ServiceTypeName is a friendly name for
  display and is not accepted by those fields.
  """
  fullName: String!

  """
  Whether the train overrides QueueSubjectKey, so its queued runs for one subject run
  one at a time (an override may still return no key for a given input). A run started with
  workQueue.runTrain bypasses that serialization and may run alongside queued or
  in-flight work for the same subject, which is what the dashboard's Run dialog warns about.
  """
  hasQueueSubjectKey: Boolean!
}

"""
Scheduler management mutations: trigger, disable, enable, and cancel manifests and groups.
Also exposes the nested deadLetters namespace.
"""
type OperationsMutations {
  """
  Applies kind to every run, dead letter or manifest filter matches, the filter
  the list read of that kind takes: CANCEL to runs (filter.executions),
  REQUEUE and ACKNOWLEDGE to dead letters (filter.deadLetters), and
  TRIGGER, ENABLE and DISABLE to manifests (filter.manifests).
  The matching ids are read once, now. When there are not exactly expectedCount of
  them, the number the operator confirmed, nothing starts and matched is the number
  there are. Otherwise the operation starts in the background on this node and is returned at
  once; read operations.bulkOperation(id) until its status is no longer
  RUNNING. It runs in batches of at most 500 ids, each through the operation the
  matching id-list mutation calls (cancelExecutions, requeueDeadLetters,
  acknowledgeDeadLetters, triggerManifests, setManifestsEnabled), and
  records each id that did not take with its reason. There is no limit on how many ids it
  matches. askAfresh applies to REQUEUE and TRIGGER only, and
  note, required, to ACKNOWLEDGE only. One runs per node at a time: while one
  runs, this starts nothing and returns that one. The caller is recorded as its
  actor, and when the host audits the API (AddAudit) its outcome is written to
  the audit too.
  """
  startBulkOperation(
    """What to do to each id."""
    kind: BulkOperationKind!

    """Which list, filtered as its read filters it."""
    filter: BulkOperationFilterInput!

    """How many matches the operator confirmed."""
    expectedCount: Int!

    """Every requeued or triggered run asks its deciders afresh."""
    askAfresh: Boolean! = false

    """Why the dead letters are acknowledged; at most 1,000 characters."""
    note: String
  ): StartBulkOperationResponse!

  """
  Nested namespace exposing dead letter mutations (requeue, acknowledge, batch ops).
  """
  deadLetters: DeadLetterMutations!

  """
  Nested namespace exposing work queue mutations (queue a train, cancel queued entries).
  """
  workQueue: WorkQueueMutations!

  """
  Nested namespace exposing manifest group mutations (updateManifestGroup).
  """
  manifestGroups: ManifestGroupMutations!

  """
  Nested namespace exposing scheduler config mutations (updateScheduler).
  """
  config: ConfigMutations!

  """
  Queues an immediate run of the manifest with this external id, outside its normal schedule,
  which continues unaffected. A manifest holds at most one queued entry, so when it already has
  one, that entry is brought forward to now instead of a second one being queued. When that
  entry is a retry, askAfresh: true makes it ask its deciders again instead of replaying
  the failed run's decisions; if the dispatcher had already claimed the retry, it is too late to
  change: the mutation still succeeds, and its message says the run replays the failed run's
  decisions. The message says which happened (a new run queued, a queued one brought forward,
  or one already due released as the trigger) and id is that work queue entry. Through
  CancellationToken), the call the dashboard's Trigger
  buttons make. An unknown external id, or a host with no database provider, where nothing
  dispatches the queue, returns success: false and changes nothing.
  """
  triggerManifest(externalId: String!, askAfresh: Boolean! = false): OperationResponse!

  """
  Queues a run of the manifest with this external id that becomes eligible for dispatch once
  delay has passed (an ISO-8601 duration such as PT5M). The normal schedule
  continues unaffected. When the manifest already has a queued entry, no second one is
  queued: that entry keeps its time if it is due sooner, and is brought forward to
  now + delay otherwise. With askAfresh: true a queued retry the trigger
  releases asks its deciders again instead of replaying the failed run's decisions; as with
  triggerManifest, the message says so when the dispatcher had already claimed it and it
  still replays. As with triggerManifest, the message says which happened and id
  is the entry. An unknown external id, or a host where nothing dispatches the queue, returns
  success: false and changes nothing.
  """
  triggerManifestDelayed(externalId: String!, delay: Duration!, askAfresh: Boolean! = false): OperationResponse!

  """
  Disables the manifest with this external id so the scheduler stops running it. The manifest
  is kept; enableManifest turns it back on. An unknown external id returns
  success: false and changes nothing.
  """
  disableManifest(externalId: String!): OperationResponse!

  """
  Enables the manifest with this external id so the scheduler runs it again. An unknown
  external id returns success: false and changes nothing.
  """
  enableManifest(externalId: String!): OperationResponse!

  """
  Requests cancellation of every pending and running execution of the manifest with this
  external id. A running train stops at its next junction boundary and ends Cancelled, and is
  not retried. count is the number of executions flagged. An unknown external id
  returns success: false and changes nothing.
  """
  cancelManifest(externalId: String!): OperationResponse!

  """
  Queues an immediate run of every enabled manifest in the group that can run on its own.
  Dependent manifests are skipped, since they run after their parent. count is the number
  of manifests a new run was queued for; the message also counts the ones that already had a
  queued run, which now runs as the trigger. Through
  CancellationToken), the call the dashboard's group
  Trigger makes. A host where nothing dispatches the queue returns success: false.
  """
  triggerGroup(groupId: Long!): OperationResponse!

  """
  Requests cancellation of every pending and running execution of every manifest in the group.
  count is the number of executions flagged.
  """
  cancelGroup(groupId: Long!): OperationResponse!

  """
  Triggers the listed manifests by id, each as triggerManifest triggers one: an
  immediate run is queued, or the manifest's queued entry is brought forward to now when it
  already has one. Through CancellationToken), the call the
  dashboard's Trigger Selected makes. With askAfresh: true a queued retry the trigger
  releases asks its deciders again instead of replaying the failed run's decisions; one the
  dispatcher had already claimed still replays, and is counted in tooLateToAskAfresh
  with a note. Unknown ids are skipped and noted without stopping the rest. An empty list, or
  more than 1000 ids, returns success: false and triggers nothing.
  """
  triggerManifests(ids: [Long!]!, askAfresh: Boolean! = false): BatchTriggerResponse!

  """
  Triggers every listed manifest group by id, each as triggerGroup triggers one: every
  enabled member that runs on its own schedule is triggered, and dependent members are left to
  run after their parent. Through CancellationToken),
  the call the dashboard's Trigger Selected on the groups page makes. The counts are of
  manifests, except matched and skipped, which count group ids. An empty list,
  or more than 1000 ids, returns success: false and triggers nothing.
  """
  triggerGroups(ids: [Long!]!): BatchTriggerResponse!

  """
  Requests cancellation of every pending and running execution of every manifest in the
  listed groups, as cancelGroup does for one, through
  CancellationToken), the call the dashboard's Cancel
  Running makes. count is the number of executions flagged, zero included. An empty
  list, or more than 1000 ids, returns success: false and flags nothing.
  """
  cancelGroups(ids: [Long!]!): OperationResponse!

  """
  Requests cancellation of a single execution by id, when it is still pending or in
  progress. The request is durable: the process running the train sees it and ends the run
  as Cancelled, and a run on this host is cancelled at once. count is 1 when the
  execution was flagged; an execution that is already finished or does not exist returns
  success: false with count 0. So does a run a step of a user's state-machine
  draft started, with the reason: a user's draft is read-only to operators, and only its user
  cancels the run, by leaving the state (central ADR 0046).
  """
  cancelExecution(id: Long!): OperationResponse!

  """
  Requests cancellation of the listed executions, as cancelExecution does for one:
  every one still pending or in progress is flagged, and finished or unknown ids are skipped.
  A run a step of a user's state-machine draft started is skipped too, and the message says
  how many and why. count is the number flagged, zero included. An empty list, or more
  than 1000 ids, returns success: false and flags nothing.
  """
  cancelExecutions(ids: [Long!]!): OperationResponse!

  """
  Enables or disables the listed manifests by id. Only manifests whose flag differs are
  written; count is the number changed, zero included. An empty list, or more than
  1000 ids, returns success: false and changes nothing.
  """
  setManifestsEnabled(ids: [Long!]!, enabled: Boolean!): OperationResponse!

  """
  Sets whether retries of the listed manifests replay the decisions of the run they retry
  (replayDecisionsOnRetry). Only manifests whose flag differs are written; count
  is the number changed, zero included. Turning it off also clears the replay link of each
  manifest's queued entry, so a retry waiting out its backoff asks afresh. An empty list, or
  more than 1000 ids, returns success: false and changes nothing.
  """
  setManifestsReplayDecisionsOnRetry(ids: [Long!]!, replay: Boolean!): OperationResponse!

  """
  Re-queues an execution: queues a fresh run of the same train with the input the execution
  recorded, through CancellationToken), the same call the
  dashboard's Re-queue button makes. Fails without queueing when the execution does not exist,
  recorded no input, recorded a placeholder in place of its input (too large, unserializable
  or disposed), or recorded an input with [TraxSensitive] members masked. When the
  execution recorded decisions, the new run replays them, so it takes the tracks the
  execution took; with askAfresh: true it asks its deciders again instead. When a
  queued entry or a run already replays that execution, the new run is queued afresh either
  way, and the message says so.
  """
  requeueExecution(id: Long!, askAfresh: Boolean! = false): OperationResponse!

  """
  Resumes a failed or cancelled execution from a checkpoint instead of running every step
  again: queues a run of the same train, with the input the execution recorded, that skips
  to the step from names (a node id, as runGraph gives it), or to the step after
  the execution's latest checkpoint when from is omitted. Through
  CancellationToken), the same call the dashboard's Resume
  and Resume from here buttons make. It is a requeue in every check but where the run starts,
  so it enqueues through the mediator and the train's [TraxAuthorize] applies, and the
  new run replays the execution's decisions. Fails without queueing, with the reason, when
  the execution does not exist, is not failed or cancelled, was started by a state machine's
  step, has a saved input a requeue would refuse, already has a queued resume, or when no
  checkpoint it wrote lets it resume at that step.
  """
  resumeExecution(
    """The execution (metadata) id."""
    id: Long!

    """
    The node id of the step to resume at, or null for after the latest checkpoint.
    """
    from: String
  ): OperationResponse!

  """
  Patches mutable settings on a single manifest (enabled, retries, priority, timeout,
  schedule). Each field on input is independent; null leaves it
  unchanged. See UpdateManifestInput for the clear-timeout semantics.
  A value the scheduler could not use returns success: false with the reason and saves
  nothing: a timeout or interval that is not positive, a negative retry count, a priority
  outside 0 to 31, a cron expression the scheduler cannot parse or that never fires, a switch
  to CRON without an expression, a switch to INTERVAL without an interval, and a
  switch to ONCE, DEPENDENT or DORMANT_DEPENDENT, which need a time or a
  parent this input cannot give. The schedule is checked only when the input changes it. Through
  CancellationToken), which runs every check.
  """
  updateManifest(id: Long!, input: UpdateManifestInput!): OperationResponse!

  """
  Turns the observational effect whose factory has this full type name on or off in THIS
  process, through Boolean), the call the
  dashboard's effects page makes. The change is in memory: it does not reach the scheduler or
  worker processes where trains usually run, and a restart restores the configured state. An
  effect the registry does not track, or tracks as not toggleable, is refused and nothing
  changes, as is any effect when the host registers no effect registry. On success
  count is 1.
  """
  setEffectEnabled(fullName: String!, enabled: Boolean!): OperationResponse!

  """
  Writes settings of the configurable effect whose factory has this full type name, in THIS
  process, through String}), the call the
  dashboard's Configure dialog makes. Send only the settings you change: one not listed is
  not written. It is all or nothing: every value is read as its setting's type and checked
  against the setting's validation before any is written, and nothing is written when one is
  refused; errors then says why, setting by setting. A sensitive setting can be
  written though it is never read back. A setting listed twice, an empty list, or more than
  1000 entries is refused. The change is in memory and applies to the next run in this
  process; it does not reach the scheduler or worker processes where trains usually run, and
  a restart restores the configured settings.
  """
  configureEffect(
    """The effect factory's full type name, as effects lists it."""
    fullName: String!

    """The settings to write, by name, as text."""
    values: [EffectSettingValueInput!]!
  ): ConfigureEffectResponse!

  """
  Cancels a system-owned state-machine instance's live train run, and the instance then
  moves through its state's OnCancelled edge. A run still queued is cancelled before
  it starts and, when this host registers the machine, the instance moves in this call
  (outcome: MOVED, state the state it entered); otherwise a host that does
  moves it (RUN_CANCELLED). A dispatched run has its cancel requested: it stops at its
  next junction and the instance moves when it ends (CANCEL_REQUESTED). Refused with
  success: false and a typed outcome, changing nothing: a user-owned instance
  (USER_OWNED; operators see users' drafts read-only), no such system instance
  (NOT_FOUND), a state that waits on no run (NO_LIVE_RUN), and a run that has
  already ended (RUN_ENDED). The message is the dashboard's, word for word.
  """
  cancelMachineInstance(
    """The machine's id."""
    machine: String!

    """Who owns the instance; only SYSTEM can be cancelled."""
    ownerKind: SnapshotOwnerKind!

    """The instance id."""
    id: UUID!
  ): MachineInstanceCancelResponse!
}

"""
Dead letter management mutations: requeue, acknowledge, and batch operations.
"""
type DeadLetterMutations {
  """
  Queues a new run for one dead letter's manifest and marks the dead letter retried. Only a dead
  letter awaiting intervention can be requeued, and a manifest holds one queued entry at a time:
  if it already has one, the result reports failure and the dead letter stays awaiting intervention.
  The new run replays the decisions of the manifest's failed run when that is sound, as a retry
  does; askAfresh: true makes it ask its deciders again.
  """
  requeueDeadLetter(id: Long!, askAfresh: Boolean! = false): DeadLetterOperationResult!

  """
  Marks one dead letter acknowledged without running it again, recording note as the
  reason. A note longer than 1,000 characters is refused by the scheduler and nothing changes.
  """
  acknowledgeDeadLetter(id: Long!, note: String!): DeadLetterOperationResult!

  """
  Requeues the listed dead letters. At most one work queue entry is created per manifest: dead
  letters that share a manifest are folded into one entry and all resolved, and a dead letter
  whose manifest already has a queued entry is skipped and left awaiting intervention.
  askAfresh: true makes every new run ask its deciders again rather than replay.
  """
  requeueDeadLetters(ids: [Long!]!, askAfresh: Boolean! = false): BatchDeadLetterResult!

  """
  Marks the listed dead letters acknowledged without running them again, recording note
  on each. A note longer than 1,000 characters is refused: count is 0 and nothing changes.
  """
  acknowledgeDeadLetters(ids: [Long!]!, note: String!): BatchDeadLetterResult!

  """
  Starts requeueing every dead letter awaiting intervention, creating at most one work queue
  entry per manifest as requeueDeadLetters does, and returns at once with the job's
  handle rather than holding the request for the whole backlog. Read
  operations.deadLetters.requeueAllJob(id) on the same node until its status is no
  longer RUNNING. The fold is not tied to this request: it finishes after the client
  goes away, and only the node shutting down stops it. While one is running on this node,
  this returns that one with started: false. askAfresh: true makes every new run
  ask its deciders again rather than replay.
  """
  requeueAllDeadLetters(askAfresh: Boolean! = false): DeadLetterRequeueJob!

  """
  Marks every dead letter awaiting intervention acknowledged, recording note on each. A
  note longer than 1,000 characters is refused: count is 0 and nothing changes.
  """
  acknowledgeAllDeadLetters(note: String!): BatchDeadLetterResult!
}

"""
Mutations for the work queue: queue a train for execution, run one now, and cancel queued entries.
Thin wrappers around IOperationsService, which the dashboard also calls. Both
share validation and the enqueue path; the train's own authorization applies here, while the
dashboard enqueues as the admin surface its host gates (see docs/0017).
"""
type WorkQueueMutations {
  """Creates a new work queue entry that the dispatcher will pick up."""
  queueTrain(input: QueueTrainInput!): OperationResponse!

  """
  Runs a train now, through the same CancellationToken) call as
  the dashboard's Run dialog: its Pending execution row is written and handed to the job
  submitter the train is routed to, skipping the work queue. The train's own authorization
  applies, as for CancellationToken).
  """
  runTrain(input: RunTrainInput!): OperationResponse!

  """
  Cancels a queued work queue entry. Only entries with status Queued can be
  cancelled, and not one a step of a user's state-machine draft queued: a user's draft is
  read-only to operators, and only its user cancels the run, by leaving the state (central
  ADR 0046).
  """
  cancelWorkQueueEntry(id: Long!): OperationResponse!

  """
  Cancels many queued entries in one statement. Only entries still in Queued are
  affected; already-dispatched or cancelled ids are skipped, and so are entries a step of a
  user's state-machine draft queued, which the message counts and explains. count is
  the number actually cancelled, zero included. An empty list, or more than 1000 ids, returns
  success: false and cancels nothing.
  """
  cancelWorkQueueEntries(ids: [Long!]!): OperationResponse!
}

"""
Mutations under operations.manifestGroups. Patches mutable fields on a manifest
group (max active jobs, priority, enabled) and enables or disables groups in bulk. Thin wrapper around
CancellationToken) so the dashboard and API
share validation and persistence.
"""
type ManifestGroupMutations {
  """
  Patches mutable settings on a manifest group. Each field on input
  is independent; passing null leaves a field unchanged.
  """
  updateManifestGroup(id: Long!, input: UpdateManifestGroupInput!): OperationResponse!

  """
  Enables or disables the listed manifest groups by id. Only groups whose flag differs are
  written, with updatedAt bumped; count is the number changed, zero included.
  An empty list, or more than 1000 ids, returns success: false and changes nothing.
  """
  setManifestGroupsEnabled(ids: [Long!]!, enabled: Boolean!): OperationResponse!

  """
  Enables or disables every manifest group. A field of its own so that "all" is never what an
  empty or missing list means. count is the number changed, zero included.
  """
  setAllManifestGroupsEnabled(enabled: Boolean!): OperationResponse!
}

"""
Mutations under operations.config. Patches mutable scheduler runtime
settings; the same service powers the dashboard's ServerSettingsPage save action.
"""
type ConfigMutations {
  """
  Changes the scheduler's runtime settings. Only the fields you set change; the rest keep their
  current values. The change takes effect at once in this process and is saved so it
  survives a restart. On success count is the number of fields that changed. A value
  outside the range the scheduler can run with refuses the whole patch: the result reports
  failure, names each offending field, and nothing is applied.
  """
  updateScheduler(input: UpdateSchedulerConfigInput!): OperationResponse!

  """
  Sets the level each listed log category filters at in THIS process, through
  ILogLevelService, the call the dashboard's server settings make. Only a
  category configured under Logging:LogLevel (or changed here before) can be set; a
  list naming any other, an empty list, or more than 1000 entries is refused whole and
  nothing changes. When a category is listed twice, the last level wins. The change lasts
  until the process restarts and does not reach the other processes of the deployment.
  notApplied lists categories whose loggers still filter at another level, which
  happens when the host sets the filter itself after Trax.
  """
  setLogLevels(
    """The categories to set, and their levels."""
    levels: [LogLevelSettingInput!]!
  ): SetLogLevelsResponse!
}

"""
Body of the persistedOperations query namespace at the root, behind the management gate.
Each field calls IPersistedOperationsService.
"""
type PersistedOperationQueries {
  """List persisted operations, most recently updated first, paginated."""
  persistedOperations(filter: PersistedOperationFilterInput, skip: Int! = 0, take: Int! = 50): PersistedOperationsPage!

  """Look up a single persisted operation. Returns null when missing."""
  persistedOperation(id: String!, tenantKey: String): PersistedOperationDto

  """Audit history for an operation, most-recent-first."""
  persistedOperationHistory(id: String!, tenantKey: String, skip: Int! = 0, take: Int! = 50): [PersistedOperationHistoryDto!]!
}

"""
Body of the persistedOperations mutation namespace at the root, behind the management
gate. Each mutation calls IPersistedOperationsService, which returns refusals as
payload errors[] entries with stable code values; mutations never throw to the
client.
"""
type PersistedOperationMutations {
  """
  Upload (insert or update) a persisted operation. Validates the document against the live
  schema, requires exactly one operation, and rejects shape-changing edits unless
  bypassShapeDiff is set.
  """
  uploadPersistedOperation(input: UploadPersistedOperationInput!): UploadPersistedOperationPayload!

  """Soft-delete an operation. Requires a non-empty reason."""
  deactivatePersistedOperation(input: DeactivatePersistedOperationInput!): DeactivatePersistedOperationPayload!

  """Reactivate a previously deactivated operation."""
  restorePersistedOperation(input: RestorePersistedOperationInput!): RestorePersistedOperationPayload!
}

"""The `Long` scalar type represents a signed 64-bit integer."""
scalar Long

"""
The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562.
"""
scalar UUID

"""
The `DateTime` scalar type represents a date and time with time zone offset information.
"""
scalar DateTime

"""The `Any` scalar type represents any valid GraphQL value."""
scalar Any

"""One declared node of a RunGraph, with what the run did there."""
type RunGraphNode {
  """The node's id; see ChainGraph."""
  id: String!

  """Which chain primitive declared the step."""
  kind: ChainStepKind!

  """The junction or decider type, or null for a step that names none."""
  junction: String

  """The type the step consumes from Memory, or null."""
  in: String

  """The type the step contributes to Memory, or null."""
  out: String

  """True when what runs is decided only at run time (Opaque)."""
  opaque: Boolean!

  """
  Where the node stands in this run. A PARALLEL step records nothing itself: it is FAILED when any branch failed, CANCELLED when one was stopped, IN_PROGRESS while any branch is still going, down the tracks its routing steps took, and COMPLETED once every branch has finished. A CHECKPOINT is COMPLETED once the run stored it. In a resumed run, a node before the point it resumed at is RESTORED: the run skipped it. Once the run has ended, a step whose end was never recorded (the host stopped mid-junction, or the end event was dropped) is INTERRUPTED, never IN_PROGRESS.
  """
  state: RunNodeState!

  """
