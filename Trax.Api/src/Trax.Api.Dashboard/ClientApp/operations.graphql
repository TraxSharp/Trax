"""The kind of step a train's junction chain declares."""
enum ChainStepKind {
  """A junction resolved by its concrete type."""
  CHAIN

  """A junction resolved from Memory by its interface type."""
  I_CHAIN

  """A junction that may end the chain early with the train's return value."""
  SHORT_CIRCUIT

  """A projection from one type in Memory to another."""
  EXTRACT

  """The terminal step that produces the train's result."""
  RESOLVE

  """
  A value handed to the chain directly, by AddServices or by Extract given a
  value, which puts its type into Memory without a junction producing it.
  """
  SEED

  """
  Asks a decider a question about a value in Memory and puts the typed decision in Memory.
  The step's junction is the decider, its input the state and its output the decision. A
  Decide asking several questions records one step per question.
  """
  DECIDE

  """
  Routes on a choice in Memory to one of several declared tracks, which
  Int32) holds.
  """
  SWITCH

  """
  Routes on a yes/no probability in Memory to its Yes, No or Unsure track.
  """
  GATE

  """Routes on a score in Memory to the track for the level it reaches."""
  SCALE

  """
  Runs a fixed set of named branches side by side, each on its own copy of Memory, and
  merges what they produce. Int32) holds the branches.
  """
  PARALLEL

  """
  Stores the state type in Memory the chain names, so a later run can resume after it. The
  step's input is the state; it contributes nothing to Memory.
  """
  CHECKPOINT
}

"""Where one declared node stands in a run."""
enum RunNodeState {
  """No step was recorded for it, and nothing says it was passed over."""
  NOT_REACHED

  """Its junction has started and not yet returned."""
  IN_PROGRESS

  """Every step recorded for it completed."""
  COMPLETED

  """
  A step recorded for it failed: the junction threw, or a decider's answer was refused.
  """
  FAILED

  """A step recorded for it stopped because the run was asked to cancel."""
  CANCELLED

  """
  It sits on a track the run did not take. A branch of a Parallel step is never passed
  over, so a node there is skipped only when the step itself sits on such a track.
  """
  SKIPPED

  """
  A kind of step that records nothing when it runs (Extract, Seed, Resolve),
  so the run cannot say whether it ran.
  """
  NOT_RECORDED

  """
  It comes after a route whose answer is withheld (a question about a [TraxSensitive]
  type), so the steps the run recorded there name no node: which ran would give the answer away.
  Those steps are in UnmatchedSteps.
  """
  WITHHELD

  """
  The run resumed from a checkpoint, and this node comes before the point it resumed at, so
  the run skipped it and recorded no step for it: what the steps before the checkpoint
  produced was restored from it instead.
  """
  RESTORED

  """
  Its junction started and never recorded an end, and the run has ended: the host stopped
  mid-junction, or the step's end event was dropped. The step's row stays in progress, so the
  node is read with the run's state rather than shown as still running.
  """
  INTERRUPTED
}

"""
One transition in a state-machine instance's history: the command that moved it, from where to where, who made
it, when, and the run or child machine it started.
"""
type MachineInstanceTransition {
  """The revision the write gave the instance."""
  revision: Long!

  """What wrote it: a start, a command, a save, a timer or a run's outcome."""
  kind: SnapshotTransitionKind!

  """
  The command that moved it (an event, a timer's event, or State.done, State.failed or
  State.cancelled for a run's outcome), or null for a creation, a save, or an outcome that could not
  be applied.
  """
  trigger: String

  """Who made it: the owner, host code, or the machine itself."""
  actor: SnapshotTransitionActor!

  """The state it left, or null for the instance's creation."""
  fromState: String

  """The state it entered."""
  toState: String!

  """When it was written."""
  at: DateTime!

  """
  When the transition before it was written: At minus this is how long the instance stayed in
  FromState since its previous write. null for the oldest recorded one.
  """
  previousAt: DateTime

  """The train run entering ToState queued, or null."""
  startedRun: MachineInstanceTransitionRun

  """The child machine instance entering ToState spawned, or null."""
  startedChild: MachineInstanceTransitionChild
}

