# ── Persisted operations ───────────────────────────────────────────────────
# Whether this caller may manage persisted operations here: the host serves the persistedOperations
# root (UsePersistedOperations with GateManagement) and the caller meets its gate. Every host
# answers it, false where management is not served, so the sidebar and the pages learn it without
# a request that fails.
query PersistedOperationsAvailable {
  operations {
    config {
      canManagePersistedOperations
    }
  }
}
