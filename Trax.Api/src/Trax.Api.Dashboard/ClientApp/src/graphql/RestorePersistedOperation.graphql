mutation RestorePersistedOperation($input: RestorePersistedOperationInput!) {
  persistedOperations {
    restorePersistedOperation(input: $input) {
      success
      errors {
        code
        message
        locations {
          line
          column
        }
        path
        oldFingerprint
        newFingerprint
      }
      operation {
        id
        tenantKey
        version
        isActive
        shapeFingerprint
      }
    }
  }
}
