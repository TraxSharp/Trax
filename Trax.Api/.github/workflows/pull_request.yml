name: Pull Request

on:
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trax
          POSTGRES_PASSWORD: trax123
          POSTGRES_DB: trax
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        # Default 'guest' user is restricted to localhost in RabbitMQ.
        # GitHub Actions service containers route through port forwarding,
        # so the broker sees connections as non-localhost and rejects
        # 'guest'. Override with a dedicated test user.
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: trax
          RABBITMQ_DEFAULT_PASS: trax123
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build --configuration Release
      - name: Create per-fixture test databases
        env:
          PGPASSWORD: trax123
        # AuthE2E fixtures self-provision via AuthE2EHost.EnsureDatabaseExists,
        # so new test classes in that suite require no changes here. Other
        # E2E test categories still rely on this explicit list.
        run: |
          for db in trax_api_operations trax_api_workqueue trax_api_logs trax_api_health; do
            psql -h localhost -U trax -d trax -c "CREATE DATABASE $db;"
          done
      - run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./TestResults
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
